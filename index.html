<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071017"><title>CantiereAI Cloud</title>
<style>
:root{--bg:#071017;--p:#0d1821;--p2:#102431;--c:#37d7ff;--a:#ff9d18;--t:#eef8fb;--m:#8ca4ae;--r:#ff5e64;--g:#4ae0a0;--l:rgba(55,215,255,.22)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.07;background-image:linear-gradient(rgba(55,215,255,.16) 1px,transparent 1px),linear-gradient(90deg,rgba(55,215,255,.16) 1px,transparent 1px);background-size:32px 32px}
main{max-width:760px;margin:auto;padding:calc(env(safe-area-inset-top) + 18px) 16px 125px;position:relative;z-index:1;min-height:100vh}
header{display:flex;justify-content:space-between;align-items:center}.brand small{color:var(--c);font-size:10px;letter-spacing:3px;font-weight:900}.brand h1{margin:4px 0 0;font-size:30px}.core{width:54px;height:54px;border:2px solid var(--a);border-radius:50%;display:grid;place-items:center;box-shadow:0 0 24px #ff9d1840}.core:after{content:"";width:28px;height:28px;border-radius:50%;background:var(--a);box-shadow:0 0 22px #ff9d1888}
.line{height:1px;background:linear-gradient(90deg,var(--c),transparent);margin:18px 0}.section{margin-top:22px}.section h3{font-size:14px;color:var(--c);letter-spacing:3px}
.card,.item,.empty{background:linear-gradient(180deg,#102431ee,#0a1821ee);border:1px solid var(--l);border-radius:18px;padding:16px}.item{margin:9px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.num{font-size:34px;font-weight:900}.lab{font-size:10px;color:var(--m);font-weight:900;letter-spacing:1px}.job{color:var(--a);font-size:12px;font-weight:900}.muted{color:var(--m);font-size:14px;margin-top:4px;line-height:1.4}.k{display:flex;justify-content:space-between;gap:10px;align-items:center}.pill{font-size:11px;padding:5px 8px;border-radius:999px;background:var(--p2);border:1px solid var(--l)}.role{color:var(--c)}.danger{color:var(--r)}.ok{color:var(--g)}.progress{height:8px;background:#071017;border-radius:999px;margin-top:10px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,#0bb5d6,var(--c))}
button,input,select,textarea{font:inherit}button{cursor:pointer}.save,.ghost,.mini{border-radius:12px;padding:12px 14px;font-weight:800}.save{width:100%;border:0;background:linear-gradient(90deg,#ff8d0a,#ffb22d);color:#111}.ghost{width:100%;border:1px solid var(--l);background:var(--p);color:var(--t);margin-top:8px}.mini{border:1px solid var(--l);background:var(--p2);color:var(--t);padding:8px 10px}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
input,select,textarea{width:100%;padding:14px;margin:5px 0 12px;border-radius:12px;border:1px solid var(--l);background:#061019;color:white;font-size:16px}textarea{min-height:84px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;background:#09131bea;backdrop-filter:blur(16px);border-top:1px solid var(--l);padding:7px 0 calc(env(safe-area-inset-bottom) + 6px);z-index:20}nav button{border:0;background:none;color:var(--m);padding:9px 12px;font-size:11px;font-weight:700}nav .on{color:var(--a)}
#plus{position:fixed;right:20px;bottom:88px;width:62px;height:62px;border-radius:50%;border:1px solid #ffbd5b;background:var(--a);font-size:30px;font-weight:800;z-index:21;box-shadow:0 0 24px #ff9d1855}
#sheet{position:fixed;inset:0;background:#000b;display:none;align-items:flex-end;z-index:40}#sheet.open{display:flex}.box{width:100%;max-height:90vh;overflow:auto;background:#09141c;border-radius:26px 26px 0 0;border-top:1px solid var(--c);padding:18px 16px calc(env(safe-area-inset-bottom) + 20px)}.top{display:flex;justify-content:space-between;align-items:center}.top b{color:var(--c)}.close{background:var(--p2);color:var(--t);border:1px solid var(--l);border-radius:10px;padding:8px 11px}
.login{max-width:430px;margin:8vh auto}.login .core{margin:0 auto 14px;width:76px;height:76px}.center{text-align:center}.tabs{display:flex;gap:7px;margin:12px 0}.tabs button{flex:1;border:1px solid var(--l);border-radius:10px;background:var(--p);color:var(--m);padding:10px}.tabs .active{color:#111;background:var(--a)}
.toast{position:fixed;left:50%;bottom:135px;transform:translateX(-50%);z-index:80;background:#0c1b24;border:1px solid var(--c);border-radius:12px;padding:11px 15px;display:none;max-width:90%;text-align:center}.toast.show{display:block}
@media(max-width:390px){nav button{padding:9px 9px;font-size:10.5px}}
</style></head>
<body>
<main id="app"><div class="center muted" style="padding-top:40vh">CONNESSIONE CLOUD…</div></main>
<button id="plus" style="display:none">+</button>
<nav id="nav" style="display:none"><button class="on" data-p="home">⌂<br>HOME</button><button data-p="sites">▣<br>CANTIERI</button><button data-p="team">◉<br>TEAM</button><button data-p="profile">⚙<br>PROFILO</button></nav>
<div id="sheet"><div class="box"><div class="top"><b id="st"></b><button class="close" id="close">Chiudi</button></div><div id="sb"></div></div></div><div id="toast" class="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(async()=>{
const supa=window.supabase.createClient('https://frehflwcnghrmqpzbpno.supabase.co','sb_publishable_SuYaTiqS5F9OifFyuadFEA_xkAqQujw',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const roles=['Amministratore','Project Manager','Capocantiere','Montatore','Ufficio tecnico','Direzione lavori','Cliente','Solo visualizzazione'];
const app=document.getElementById('app'),nav=document.getElementById('nav'),plus=document.getElementById('plus'),sheet=document.getElementById('sheet'),st=document.getElementById('st'),sb=document.getElementById('sb'),toast=document.getElementById('toast');
let page='home',session=null,profile=null,sites=[],members=[],detail=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const msg=t=>{toast.textContent=t;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),2100)};
const open=(t,h)=>{st.textContent=t;sb.innerHTML=h;sheet.classList.add('open')};const close=()=>sheet.classList.remove('open');
function head(h){app.innerHTML=`<header><div class="brand"><small>JARVIS CONSTRUCTION OS · CLOUD V5.1</small><h1>CANTIERE AI</h1></div><div class="core"></div></header><div class="line"></div>${h}`}
function role(id){return members.find(x=>x.site_id===id&&x.user_id===session.user.id)?.role||''} function manage(id){return ['Amministratore','Project Manager'].includes(role(id))}
async function load(){let [p,s,m]=await Promise.all([supa.from('profiles').select('*').eq('id',session.user.id).maybeSingle(),supa.from('sites').select('*').order('created_at',{ascending:false}),supa.from('site_members').select('*')]);profile=p.data||{full_name:'',email:session.user.email};sites=s.data||[];members=m.data||[]}
function login(mode='login'){nav.style.display='none';plus.style.display='none';app.innerHTML=`<div class="login"><div class="center"><div class="core"></div><div class="job">CANTIEREAI CLOUD</div><h1>ACCESSO</h1></div><div class="item"><div class="tabs"><button class="${mode==='login'?'active':''}" data-tab="login">Accedi</button><button class="${mode==='signup'?'active':''}" data-tab="signup">Registrati</button></div>${mode==='signup'?'<input id="an" placeholder="Nome e cognome">':''}<input id="ae" type="email" placeholder="Email"><input id="ap" type="password" placeholder="Password (min. 6 caratteri)"><button class="save" data-auth="${mode}">${mode==='login'?'ACCEDI':'CREA ACCOUNT'}</button><div class="muted" style="margin-top:10px">${mode==='signup'?'Se sei stato invitato usa la stessa email dell’invito.':'Accesso al database cloud CantiereAI.'}</div></div></div>`}
function setPage(p){page=p;detail=null;nav.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.p===p));render()}
function render(){
 if(!session)return login();
 if(detail)return siteDetail(detail);
 if(page==='home')return head(`<div class="grid"><div class="card"><div class="num">${sites.length}</div><div class="lab">CANTIERI VISIBILI</div></div><div class="card"><div class="num">${sites.filter(x=>manage(x.id)).length}</div><div class="lab">CANTIERI GESTITI</div></div></div><div class="section"><h3>IDENTITÀ CLOUD</h3><div class="item"><b>${esc(profile?.full_name||session.user.email)}</b><div class="muted">${esc(session.user.email)}</div><span class="pill ok">SYNC ATTIVO</span></div></div><div class="section"><h3>I TUOI CANTIERI</h3>${sites.map(s=>`<div class="item" data-site="${s.id}"><div class="k"><b>${esc(s.name)}</b><span class="job">${esc(s.job_number)}</span></div><div class="muted">${esc(s.client||'')}</div><div class="progress"><i style="width:${s.progress||0}%"></i></div><div class="muted">Ruolo: <span class="role">${esc(role(s.id))}</span></div></div>`).join('')||'<div class="empty">Nessun cantiere.</div>'}</div>`);
 if(page==='sites')return head(`<div class="section"><h3>CANTIERI CLOUD</h3>${sites.map(s=>`<div class="item"><div class="k"><b>${esc(s.name)}</b><span class="job">${esc(s.job_number)}</span></div><div class="muted">${esc(s.client||'')} · ${esc(s.address||'')}</div><div class="progress"><i style="width:${s.progress||0}%"></i></div><div class="row"><button class="mini" data-site="${s.id}">Apri</button>${manage(s.id)?`<button class="mini" data-team="${s.id}">TEAM ACCESS</button>`:''}</div></div>`).join('')||'<div class="empty">Premi + per creare il primo cantiere.</div>'}</div>`);
 if(page==='team')return teamPage();
 if(page==='profile')return head(`<div class="section"><h3>PROFILO CLOUD</h3><div class="item"><input id="pn" value="${esc(profile?.full_name||'')}" placeholder="Nome e cognome"><input value="${esc(session.user.email)}" disabled><button class="save" data-profile>SALVA</button><button class="ghost danger" data-logout>ESCI</button></div></div>`);
}
async function teamPage(){const ids=sites.filter(x=>manage(x.id)).map(x=>x.id);if(!ids.length)return head('<div class="empty">Non gestisci ancora nessun cantiere.</div>');let r=await supa.from('site_members').select('*').in('site_id',ids),rows=r.data||[],uids=[...new Set(rows.map(x=>x.user_id))],pm={};if(uids.length){let p=await supa.from('profiles').select('*').in('id',uids);(p.data||[]).forEach(x=>pm[x.id]=x)}head(`<div class="section"><h3>TEAM DIRECTORY</h3>${rows.map(x=>{let p=pm[x.user_id]||{},s=sites.find(z=>z.id===x.site_id);return `<div class="item"><div class="k"><b>${esc(p.full_name||p.email||'Utente')}</b><span class="pill role">${esc(x.role)}</span></div><div class="muted">${esc(p.email||'')}</div><div class="job">${esc(s?.job_number||'')} · ${esc(s?.name||'')}</div></div>`}).join('')}</div>`) }
async function siteDetail(id){let s=sites.find(x=>x.id===id);if(!s){detail=null;return render()}let [a,i]=await Promise.all([supa.from('activities').select('*').eq('site_id',id).order('created_at',{ascending:false}),supa.from('issues').select('*').eq('site_id',id).order('created_at',{ascending:false})]);head(`<button class="mini" data-back>← Cantieri</button><div class="section"><div class="item"><div class="job">COMMESSA ${esc(s.job_number)}</div><h2>${esc(s.name)}</h2><div class="muted">${esc(s.client||'')} · ${esc(s.address||'')}</div><div class="muted">Ruolo: <span class="role">${esc(role(id))}</span></div><div class="progress"><i style="width:${s.progress||0}%"></i></div></div></div><div class="section"><h3>AZIONI</h3><div class="grid"><button class="ghost" data-act="${id}">+ Attività</button><button class="ghost" data-issue="${id}">+ Problema</button>${manage(id)?`<button class="ghost" data-team="${id}">◉ Team Access</button><button class="ghost" data-edit="${id}">✎ Modifica</button>`:''}</div></div><div class="section"><h3>PROBLEMI</h3>${(i.data||[]).map(x=>`<div class="item"><b class="${x.status==='Risolto'?'ok':'danger'}">⚠ ${esc(x.title)}</b><div class="job">${esc(x.priority)}</div><div class="muted">${esc(x.details||'')}</div></div>`).join('')||'<div class="empty">Nessun problema.</div>'}</div><div class="section"><h3>ATTIVITÀ</h3>${(a.data||[]).map(x=>`<div class="item"><b>${esc(x.title)}</b><div class="muted">${esc(x.notes||'')}</div></div>`).join('')||'<div class="empty">Nessuna attività.</div>'}</div>`)}
function siteForm(s=null){open(s?'MODIFICA CANTIERE':'NUOVO CANTIERE',`<input id="sj" placeholder="Numero commessa" value="${esc(s?.job_number||'')}"><input id="sn" placeholder="Nome cantiere" value="${esc(s?.name||'')}"><input id="sc" placeholder="Cliente" value="${esc(s?.client||'')}"><input id="sa" placeholder="Indirizzo" value="${esc(s?.address||'')}"><select id="ss"><option>Attivo</option><option>In pausa</option><option>Completato</option></select><input id="sp" type="number" min="0" max="100" value="${s?.progress||0}" placeholder="Avanzamento %"><textarea id="snotes" placeholder="Note">${esc(s?.notes||'')}</textarea><button class="save" data-savesite="${s?.id||''}">SALVA</button>`);if(s)document.getElementById('ss').value=s.status}
async function teamAccess(id){let s=sites.find(x=>x.id===id),r=await supa.from('site_members').select('*').eq('site_id',id),rows=r.data||[],uids=[...new Set(rows.map(x=>x.user_id))],pm={};if(uids.length){let p=await supa.from('profiles').select('*').in('id',uids);(p.data||[]).forEach(x=>pm[x.id]=x)}open('TEAM ACCESS',`<div class="item"><div class="job">${esc(s.job_number)}</div><b>${esc(s.name)}</b></div>${rows.map(x=>`<div class="item"><b>${esc(pm[x.user_id]?.full_name||pm[x.user_id]?.email||'Utente')}</b><div class="role">${esc(x.role)}</div></div>`).join('')}<button class="save" data-invite="${id}">+ INVITA UTENTE</button>`)}
function inviteForm(id){open('INVITA UTENTE',`<input id="inviteName" placeholder="Nome e cognome"><input id="inviteEmail" type="email" placeholder="Email"><select id="inviteRole">${roles.map(x=>`<option>${x}</option>`).join('')}</select><input id="inviteSite" type="hidden" value="${id}"><button class="save" data-send>INVIA INVITO REALE</button><div class="muted" style="margin-top:10px">L'utente verrà associato a questa commessa con il ruolo scelto.</div>`)}
nav.onclick=e=>{let b=e.target.closest('[data-p]');if(b)setPage(b.dataset.p)};plus.onclick=()=>siteForm();document.getElementById('close').onclick=close;sheet.onclick=e=>{if(e.target===sheet)close()};
document.addEventListener('click',async e=>{
let x=e.target.closest('[data-tab]');if(x)return login(x.dataset.tab);
x=e.target.closest('[data-auth]');if(x){let email=document.getElementById('ae').value.trim(),password=document.getElementById('ap').value;if(!email||password.length<6)return msg('Controlla email e password');if(x.dataset.auth==='login'){let r=await supa.auth.signInWithPassword({email,password});if(r.error)return msg(r.error.message);session=r.data.session;await load();nav.style.display='flex';plus.style.display='block';render();msg('Accesso eseguito')}else{let full_name=document.getElementById('an').value.trim(),r=await supa.auth.signUp({email,password,options:{data:{full_name}}});if(r.error)return msg(r.error.message);if(r.data.session){session=r.data.session;await load();nav.style.display='flex';plus.style.display='block';render()}else login();msg(r.data.session?'Account creato':'Controlla la tua email')}return}
x=e.target.closest('[data-site]');if(x){detail=x.dataset.site;return render()};if(e.target.closest('[data-back]')){detail=null;return setPage('sites')}
x=e.target.closest('[data-team]');if(x)return teamAccess(x.dataset.team);x=e.target.closest('[data-invite]');if(x)return inviteForm(x.dataset.invite);
x=e.target.closest('[data-edit]');if(x)return siteForm(sites.find(s=>s.id===x.dataset.edit));
x=e.target.closest('[data-act]');if(x)return open('NUOVA ATTIVITÀ',`<input id="at" placeholder="Attività"><textarea id="anote" placeholder="Note"></textarea><input id="asid" type="hidden" value="${x.dataset.act}"><button class="save" data-saveact>SALVA</button>`);
x=e.target.closest('[data-issue]');if(x)return open('NUOVO PROBLEMA',`<input id="it" placeholder="Problema"><select id="ip"><option>Bassa</option><option selected>Media</option><option>Alta</option><option>Critica</option></select><textarea id="idetail" placeholder="Dettagli"></textarea><input id="iid" type="hidden" value="${x.dataset.issue}"><button class="save" data-saveissue>SALVA</button>`);
x=e.target.closest('[data-savesite]');if(x){let d={job_number:sj.value.trim(),name:sn.value.trim(),client:sc.value.trim(),address:sa.value.trim(),status:ss.value,progress:Math.max(0,Math.min(100,+sp.value||0)),notes:snotes.value.trim()};if(!d.job_number||!d.name)return msg('Commessa e nome obbligatori');let r=x.dataset.savesite?await supa.from('sites').update(d).eq('id',x.dataset.savesite):await supa.from('sites').insert({...d,created_by:session.user.id});if(r.error)return msg(r.error.message);close();await load();setPage('sites');return msg('Cantiere salvato')}
if(e.target.closest('[data-send]')){let body={site_id:document.getElementById('inviteSite').value,email:document.getElementById('inviteEmail').value.trim(),role:document.getElementById('inviteRole').value,full_name:document.getElementById('inviteName').value.trim()};if(!body.email)return msg('Inserisci email');e.target.disabled=true;e.target.textContent='INVIO…';let r=await supa.functions.invoke('invite-site-user',{body});e.target.disabled=false;e.target.textContent='INVIA INVITO REALE';if(r.error||r.data?.error)return msg(r.data?.error||r.error.message);close();await load();render();return msg(r.data?.message||'Invito inviato')}
if(e.target.closest('[data-saveact]')){let sid=asid.value,r=await supa.from('activities').insert({site_id:sid,title:at.value.trim(),notes:anote.value.trim(),created_by:session.user.id});if(r.error)return msg(r.error.message);close();detail=sid;render();return msg('Attività salvata')}
if(e.target.closest('[data-saveissue]')){let sid=iid.value,r=await supa.from('issues').insert({site_id:sid,title:it.value.trim(),priority:ip.value,details:idetail.value.trim(),created_by:session.user.id});if(r.error)return msg(r.error.message);close();detail=sid;render();return msg('Problema salvato')}
if(e.target.closest('[data-profile]')){let r=await supa.from('profiles').upsert({id:session.user.id,email:session.user.email,full_name:pn.value.trim()});if(r.error)return msg(r.error.message);await load();render();return msg('Profilo salvato')}
if(e.target.closest('[data-logout]')){await supa.auth.signOut();session=null;login()}
});
let gs=await supa.auth.getSession();session=gs.data.session;if(session){nav.style.display='flex';plus.style.display='block';await load();render()}else login();
})();
</script></body></html>
