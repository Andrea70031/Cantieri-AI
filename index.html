<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071017"><title>CantiereAI</title><style>
:root{--bg:#071017;--p:#0d1821;--line:#1f4c5f;--cyan:#37d7ff;--amber:#ff9d18;--text:#eef8fb;--muted:#8ca4ae;--red:#ff5e64;--green:#4ae0a0}*{box-sizing:border-box}body{margin:0;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:radial-gradient(circle at 80% 10%,#37d7ff18,transparent 25%),var(--bg)}main{max-width:760px;margin:auto;padding:calc(env(safe-area-inset-top) + 18px) 16px 118px;min-height:100vh}header{display:flex;justify-content:space-between;align-items:center}.brand small{color:var(--cyan);font-size:10px;letter-spacing:3px;font-weight:900}.brand h1{margin:4px 0;font-size:30px}.core{width:54px;height:54px;border:2px solid var(--amber);border-radius:50%;display:grid;place-items:center;box-shadow:0 0 24px #ff9d1840}.core:after{content:"";width:28px;height:28px;border-radius:50%;background:var(--amber);box-shadow:0 0 22px #ff9d1888}.hud{height:1px;background:linear-gradient(90deg,var(--cyan),transparent);margin:16px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card,.item,.empty{background:linear-gradient(180deg,#102431ee,#0a1821ee);border:1px solid #37d7ff33;border-radius:18px;padding:16px}.num{font-size:36px;font-weight:900}.lab{font-size:10px;color:var(--muted);font-weight:900}.section{margin-top:22px}.section h3{font-size:11px;color:var(--cyan);letter-spacing:2px}.item{margin:9px 0}.job{color:var(--amber);font-size:11px;font-weight:900}.muted{color:var(--muted);font-size:13px;margin-top:4px}.progress{height:8px;background:#071017;border-radius:999px;margin-top:10px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,#0bb5d6,var(--cyan))}nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;background:#09131bea;backdrop-filter:blur(16px);border-top:1px solid #37d7ff33;padding:7px 0 calc(env(safe-area-inset-bottom) + 6px);z-index:20}nav button{border:0;background:none;color:var(--muted);padding:10px 14px;font-size:12px;line-height:1.25;letter-spacing:.45px;font-weight:700}nav .on{color:var(--amber)}#plus{position:fixed;right:20px;bottom:88px;width:60px;height:60px;border-radius:50%;border:1px solid #ffbd5b;background:var(--amber);font-size:30px;font-weight:800;z-index:21;box-shadow:0 0 24px #ff9d1855}#sheet{position:fixed;inset:0;background:#000b;display:none;align-items:flex-end;z-index:40}#sheet.open{display:flex}.sheet{width:100%;background:#09141c;border-radius:26px 26px 0 0;border-top:1px solid var(--cyan);padding:18px 16px calc(env(safe-area-inset-bottom) + 20px)}.top{display:flex;justify-content:space-between;align-items:center}.top b{color:var(--cyan)}input,textarea,select{width:100%;padding:14px;margin:6px 0 12px;border-radius:12px;border:1px solid #37d7ff33;background:#061019;color:white;font-size:16px}.save,.ghost,.close,.mini{border-radius:12px;padding:13px;font-weight:800}.save{width:100%;border:0;background:var(--amber);color:#111}.ghost,.close,.mini{border:1px solid #37d7ff33;background:var(--p);color:var(--text)}.ghost{width:100%;margin-top:8px}.danger{color:var(--red)}.ok{color:var(--green)}.row{display:flex;gap:8px;margin-top:10px}
</style></head><body><main id="app"></main><button id="plus">+</button><nav><button class="on" data-p="home">⌂<br>HOME</button><button data-p="sites">▣<br>CANTIERI</button><button data-p="acts">✓<br>ATTIVITÀ</button><button data-p="issues">⚠<br>PROBLEMI</button></nav><div id="sheet"><div class="sheet"><div class="top"><b id="st">NUOVO INSERIMENTO</b><button class="close" id="close">Chiudi</button></div><div id="sb"></div></div></div><script>
let page='home',db;try{db=JSON.parse(localStorage.getItem('cantiereAI')||'null')}catch(e){}if(!db||!db.sites)db={sites:[],acts:[],issues:[]};const A=document.getElementById('app'),P=document.getElementById('plus'),SH=document.getElementById('sheet'),SB=document.getElementById('sb'),ST=document.getElementById('st');const save=()=>localStorage.setItem('cantiereAI',JSON.stringify(db)),id=()=>Date.now().toString(36),e=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function head(x){A.innerHTML='<header><div class="brand"><small>JARVIS CONSTRUCTION OS</small><h1>CANTIERE AI</h1></div><div class="core"></div></header><div class="hud"></div>'+x}function setPage(p){page=p;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.p===p));render()}document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>setPage(b.dataset.p));document.getElementById('close').onclick=()=>SH.classList.remove('open');SH.onclick=x=>{if(x.target===SH)SH.classList.remove('open')};P.onclick=()=>openAdd();function render(){if(page==='home'){let open=db.issues.filter(x=>!x.done).length;head(`<div class="grid"><div class="card"><div class="num">${db.sites.length}</div><div class="lab">CANTIERI</div></div><div class="card"><div class="num">${open}</div><div class="lab">PROBLEMI APERTI</div></div></div><div class="section"><h3>ATTIVITÀ RECENTI</h3>${db.acts.slice(-5).reverse().map(x=>`<div class="item"><b>${e(x.title)}</b><div class="job">COMMESSA ${e(x.job)}</div><div class="muted">${e(x.notes)}</div></div>`).join('')||'<div class="empty">Sistema pronto. Premi + per iniziare.</div>'}</div><div class="section"><h3>STATO CANTIERI</h3>${db.sites.map(x=>`<div class="item"><b>${e(x.name)}</b><div class="job">${e(x.job)} · ${e(x.status||'Attivo')}</div><div class="progress"><i style="width:${+x.progress||0}%"></i></div></div>`).join('')||'<div class="empty">Nessun cantiere.</div>'}</div>`)}if(page==='sites')head(`<div class="section"><h3>CANTIERI</h3>${db.sites.map(x=>`<div class="item"><b>${e(x.name)}</b><div class="job">COMMESSA ${e(x.job)}</div><div class="muted">${e(x.client)} · ${e(x.address)}</div><div class="progress"><i style="width:${+x.progress||0}%"></i></div></div>`).join('')||'<div class="empty">Nessun cantiere.</div>'}</div>`);if(page==='acts')head(`<div class="section"><h3>ATTIVITÀ</h3>${db.acts.slice().reverse().map(x=>`<div class="item"><b>${e(x.title)}</b><div class="job">${e(x.job)}</div><div class="muted">${e(x.notes)}</div></div>`).join('')||'<div class="empty">Nessuna attività.</div>'}</div>`);if(page==='issues')head(`<div class="section"><h3>PROBLEMI</h3>${db.issues.slice().reverse().map(x=>`<div class="item"><b class="${x.done?'ok':'danger'}">${x.done?'✓':'⚠'} ${e(x.title)}</b><div class="job">${e(x.job)} · ${e(x.priority)}</div><div class="muted">${e(x.details)}</div><div class="row"><button class="mini" onclick="toggleIssue('${x.id}')">${x.done?'Riapri':'Risolto'}</button></div></div>`).join('')||'<div class="empty">Nessun problema.</div>'}</div>`)}function openAdd(){if(page==='home'){ST.textContent='NUOVO INSERIMENTO';SB.innerHTML='<button class="save" onclick="form(\'site\')">+ Nuovo cantiere</button><button class="ghost" onclick="form(\'act\')">+ Nuova attività</button><button class="ghost" onclick="form(\'issue\')">+ Nuovo problema</button>';SH.classList.add('open')}else form(page==='sites'?'site':page==='acts'?'act':'issue')}function form(t){SH.classList.add('open');if(t==='site'){ST.textContent='NUOVO CANTIERE';SB.innerHTML='<input id="job" placeholder="Numero commessa"><input id="name" placeholder="Nome cantiere"><input id="client" placeholder="Cliente"><input id="address" placeholder="Indirizzo"><select id="status"><option>Attivo</option><option>In pausa</option><option>Completato</option></select><input id="progress" type="number" min="0" max="100" placeholder="Avanzamento %"><button class="save" onclick="addSite()">SALVA</button>'}if(t==='act'){ST.textContent='NUOVA ATTIVITÀ';SB.innerHTML='<input id="title" placeholder="Attività"><input id="job" placeholder="Numero commessa"><textarea id="notes" placeholder="Note"></textarea><button class="save" onclick="addAct()">SALVA</button>'}if(t==='issue'){ST.textContent='NUOVO PROBLEMA';SB.innerHTML='<input id="title" placeholder="Problema"><input id="job" placeholder="Numero commessa"><select id="priority"><option>Media</option><option>Alta</option><option>Critica</option></select><textarea id="details" placeholder="Dettagli"></textarea><button class="save" onclick="addIssue()">SALVA</button>'}}window.form=form;window.addSite=()=>{if(!job.value||!name.value)return alert('Inserisci numero commessa e nome cantiere');db.sites.push({id:id(),job:job.value,name:name.value,client:client.value,address:address.value,status:status.value,progress:+progress.value||0});save();SH.classList.remove('open');setPage('sites')};window.addAct=()=>{if(!title.value)return;db.acts.push({id:id(),title:title.value,job:job.value,notes:notes.value});save();SH.classList.remove('open');setPage('acts')};window.addIssue=()=>{if(!title.value)return;db.issues.push({id:id(),title:title.value,job:job.value,priority:priority.value,details:details.value,done:false});save();SH.classList.remove('open');setPage('issues')};window.toggleIssue=x=>{let q=db.issues.find(y=>y.id===x);if(q){q.done=!q.done;save();render()}};render();
</script></body></html>
