<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071017">
<title>CantiereAI V4.1</title>
<style>
:root{--bg:#071017;--panel:#0d1821;--panel2:#102431;--cyan:#37d7ff;--amber:#ff9d18;--text:#eef8fb;--muted:#8ca4ae;--red:#ff5e64;--green:#4ae0a0;--line:rgba(55,215,255,.22)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.08;background-image:linear-gradient(rgba(55,215,255,.16) 1px,transparent 1px),linear-gradient(90deg,rgba(55,215,255,.16) 1px,transparent 1px);background-size:32px 32px}
main{max-width:760px;margin:auto;padding:calc(env(safe-area-inset-top) + 18px) 16px 124px;position:relative;z-index:1;min-height:100vh}
header{display:flex;justify-content:space-between;align-items:center}.brand small{color:var(--cyan);font-size:10px;letter-spacing:3px;font-weight:900}.brand h1{margin:4px 0 0;font-size:30px}.core{width:54px;height:54px;border:2px solid var(--amber);border-radius:50%;display:grid;place-items:center;box-shadow:0 0 24px rgba(255,157,24,.25)}.core:after{content:"";width:28px;height:28px;border-radius:50%;background:var(--amber);box-shadow:0 0 22px rgba(255,157,24,.55)}
.hudline{height:1px;background:linear-gradient(90deg,var(--cyan),transparent);margin:18px 0}.section{margin-top:22px}.section h3{font-size:14px;color:var(--cyan);letter-spacing:3px}.card,.item,.empty,.notice{background:linear-gradient(180deg,rgba(16,36,49,.94),rgba(10,24,33,.94));border:1px solid var(--line);border-radius:18px;padding:16px}.item{margin:9px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.num{font-size:34px;font-weight:900}.lab{font-size:10px;color:var(--muted);font-weight:900;letter-spacing:1px}.job{color:var(--amber);font-size:12px;font-weight:900}.muted{color:var(--muted);font-size:14px;margin-top:4px;line-height:1.4}.kicker{display:flex;justify-content:space-between;gap:10px;align-items:center}.pill{font-size:11px;padding:5px 8px;border-radius:999px;background:var(--panel2);border:1px solid var(--line)}.role{color:var(--cyan)}.danger{color:var(--red)}.ok{color:var(--green)}
button,input,select{font:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent}.save,.ghost,.mini{border-radius:12px;padding:12px 14px;font-weight:800}.save{width:100%;border:0;background:linear-gradient(90deg,#ff8d0a,#ffb22d);color:#111}.ghost{width:100%;border:1px solid var(--line);background:var(--panel);color:var(--text);margin-top:8px}.mini{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:8px 10px}.rowBtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
input,select{width:100%;padding:14px;margin:5px 0 12px;border-radius:12px;border:1px solid var(--line);background:#061019;color:white;font-size:16px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;background:#09131bea;backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:7px 0 calc(env(safe-area-inset-bottom) + 6px);z-index:20}nav button{border:0;background:none;color:var(--muted);padding:9px 12px;font-size:11px;font-weight:700}nav .on{color:var(--amber)}
#plus{position:fixed;right:20px;bottom:88px;width:62px;height:62px;border-radius:50%;border:1px solid #ffbd5b;background:var(--amber);font-size:30px;font-weight:800;z-index:21;box-shadow:0 0 24px rgba(255,157,24,.35)}
#sheet{position:fixed;inset:0;background:#000b;display:none;align-items:flex-end;z-index:40}#sheet.open{display:flex}.sheetBox{width:100%;max-height:90vh;overflow:auto;background:#09141c;border-radius:26px 26px 0 0;border-top:1px solid var(--cyan);padding:18px 16px calc(env(safe-area-inset-bottom) + 20px)}.sheetTop{display:flex;justify-content:space-between;align-items:center}.sheetTop b{color:var(--cyan);font-size:18px;letter-spacing:1px}.close{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:8px 11px}
.usercard{display:flex;align-items:center;gap:12px}.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--panel2);border:1px solid var(--line);font-weight:900;color:var(--amber)}.grow{flex:1}.access{padding:10px 12px;border-radius:14px;background:#09131b;border:1px solid var(--line);margin-top:8px}.access b{font-size:13px}.access small{display:block;color:var(--muted);margin-top:3px}.notice{border-color:rgba(255,157,24,.3);background:rgba(255,157,24,.08);color:#ffd797;font-size:13px}
.toast{position:fixed;left:50%;bottom:135px;transform:translateX(-50%);z-index:80;background:#0c1b24;border:1px solid var(--cyan);border-radius:12px;padding:11px 15px;display:none;max-width:90%;text-align:center;box-shadow:0 10px 30px #0008}.toast.show{display:block}
</style>
</head>
<body>
<main id="app"></main>
<button id="plus" aria-label="Aggiungi">+</button>
<nav id="nav">
  <button class="on" data-page="home">⌂<br>HOME</button>
  <button data-page="sites">▣<br>CANTIERI</button>
  <button data-page="team">◉<br>TEAM</button>
  <button data-page="profile">⚙<br>PROFILO</button>
</nav>
<div id="sheet"><div class="sheetBox"><div class="sheetTop"><b id="sheetTitle">NUOVO</b><button class="close" id="closeSheet">Chiudi</button></div><div id="sheetBody"></div></div></div>
<div id="toast" class="toast"></div>

<script>
(()=>{
'use strict';

const roles=['Project Manager','Capocantiere','Montatore','Ufficio tecnico','Direzione lavori','Cliente','Solo visualizzazione'];
let page='home';

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

function loadDb(){
  let d=null;
  try{d=JSON.parse(localStorage.getItem('cantiereAI_v41')||'null')}catch(e){}
  if(!d){
    try{
      const old=JSON.parse(localStorage.getItem('cantiereAI_v4')||'null');
      if(old)d=old;
    }catch(e){}
  }
  if(!d){
    try{
      const old=JSON.parse(localStorage.getItem('cantiereAI')||'null');
      if(old){
        d={sites:(old.sites||[]).map(s=>({id:s.id||uid(),job:s.job||'',name:s.name||'',client:s.client||''})),users:[],memberships:[],currentUser:{id:'me',name:'Andrea',email:'',role:'Amministratore'}};
      }
    }catch(e){}
  }
  if(!d)d={sites:[],users:[],memberships:[],currentUser:{id:'me',name:'Andrea',email:'',role:'Amministratore'}};
  d.sites=d.sites||[];d.users=d.users||[];d.memberships=d.memberships||[];d.currentUser=d.currentUser||{id:'me',name:'Andrea',email:'',role:'Amministratore'};
  d.sites.forEach(s=>s.id=s.id||uid());
  d.users.forEach(u=>u.id=u.id||uid());
  d.memberships.forEach(m=>m.id=m.id||uid());
  return d;
}
let db=loadDb();
const persist=()=>localStorage.setItem('cantiereAI_v41',JSON.stringify(db));

const app=document.getElementById('app'),nav=document.getElementById('nav'),plus=document.getElementById('plus'),sheet=document.getElementById('sheet'),sheetTitle=document.getElementById('sheetTitle'),sheetBody=document.getElementById('sheetBody'),toast=document.getElementById('toast');

function showToast(t){toast.textContent=t;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1800)}
function head(content){app.innerHTML=`<header><div class="brand"><small>JARVIS CONSTRUCTION OS</small><h1>CANTIERE AI</h1></div><div class="core"></div></header><div class="hudline"></div>${content}`}
function openSheet(title,html){sheetTitle.textContent=title;sheetBody.innerHTML=html;sheet.classList.add('open')}
function closeSheet(){sheet.classList.remove('open')}
function setPage(p){page=p;nav.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('on',b.dataset.page===p));render()}

function render(){
  if(page==='home')return renderHome();
  if(page==='sites')return renderSites();
  if(page==='team')return renderTeam();
  if(page==='profile')return renderProfile();
}

function renderHome(){
  head(`
    <div class="grid">
      <div class="card"><div class="num">${db.sites.length}</div><div class="lab">CANTIERI</div></div>
      <div class="card"><div class="num">${db.users.length}</div><div class="lab">UTENTI TEAM</div></div>
    </div>
    <div class="section"><h3>ACCESSO UTENTE</h3>
      <div class="item usercard"><div class="avatar">${esc((db.currentUser.name||'U').slice(0,1).toUpperCase())}</div><div class="grow"><b>${esc(db.currentUser.name||'Utente')}</b><div class="muted">${esc(db.currentUser.role||'Amministratore')}</div></div><span class="pill role">ONLINE</span></div>
    </div>
    <div class="section"><h3>CANTIERI</h3>
      ${db.sites.map(s=>`<div class="item"><div class="kicker"><b>${esc(s.name)}</b><span class="job">${esc(s.job)}</span></div><div class="muted">${esc(s.client||'')}</div><div class="muted">${db.memberships.filter(m=>m.siteId===s.id).length} utenti con accesso</div></div>`).join('')||'<div class="empty">Nessun cantiere.</div>'}
    </div>
    <div class="notice">Gli inviti di questa versione vengono creati e condivisi dal tuo iPhone, ma non danno ancora accesso reale da un altro telefono: per quello serve il backend cloud.</div>
  `)
}

function renderSites(){
  head(`<div class="section"><h3>CANTIERI & ACCESSI</h3>
    ${db.sites.map(s=>`<div class="item"><div class="kicker"><b>${esc(s.name)}</b><span class="job">${esc(s.job)}</span></div><div class="muted">${esc(s.client||'')}</div><div class="rowBtns"><button class="mini" data-action="manage-site" data-id="${s.id}">TEAM ACCESS (${db.memberships.filter(m=>m.siteId===s.id).length})</button><button class="mini danger" data-action="delete-site" data-id="${s.id}">Elimina</button></div></div>`).join('')||'<div class="empty">Nessun cantiere. Premi + per crearne uno.</div>'}
  </div>`)
}

function renderTeam(){
  head(`<div class="section"><h3>TEAM DIRECTORY</h3>
    ${db.users.map(u=>`<div class="item usercard"><div class="avatar">${esc((u.name||u.email||'U').slice(0,1).toUpperCase())}</div><div class="grow"><b>${esc(u.name||u.email)}</b><div class="muted">${esc(u.email)}</div><div class="muted">${db.memberships.filter(m=>m.userId===u.id).length} cantieri assegnati</div></div><button class="mini" data-action="user-access" data-id="${u.id}">Accessi</button></div>`).join('')||'<div class="empty">Nessun utente. Premi + per creare un invito.</div>'}
  </div>`)
}

function renderProfile(){
  head(`<div class="section"><h3>PROFILO UTENTE</h3><div class="item">
    <label class="muted">Nome</label><input id="pName" value="${esc(db.currentUser.name||'')}">
    <label class="muted">Email</label><input id="pEmail" type="email" value="${esc(db.currentUser.email||'')}">
    <button class="save" data-action="save-profile">SALVA PROFILO</button>
  </div></div>`)
}

function showSiteForm(){
  openSheet('NUOVO CANTIERE',`<input id="sJob" placeholder="Numero commessa"><input id="sName" placeholder="Nome cantiere"><input id="sClient" placeholder="Cliente"><button class="save" data-save="site">SALVA CANTIERE</button>`)
}

function showInviteForm(siteId=''){
  if(!db.sites.length){showToast('Crea prima un cantiere');setPage('sites');return}
  openSheet('INVITA UTENTE',`
    <input id="uName" placeholder="Nome utente">
    <input id="uEmail" type="email" placeholder="Email">
    ${siteId?`<input type="hidden" id="inviteSiteId" value="${siteId}">`:`<select id="inviteSiteId"><option value="">Seleziona cantiere</option>${db.sites.map(s=>`<option value="${s.id}">${esc(s.job)} — ${esc(s.name)}</option>`).join('')}</select>`}
    <select id="uRole">${roles.map(r=>`<option>${r}</option>`).join('')}</select>
    <button class="save" data-save="invite">CREA E CONDIVIDI INVITO</button>
  `)
}

function showSiteAccess(siteId){
  const s=db.sites.find(x=>x.id===siteId);if(!s)return;
  const ms=db.memberships.filter(m=>m.siteId===siteId);
  openSheet('TEAM ACCESS',`
    <div class="item"><div class="job">COMMESSA ${esc(s.job)}</div><b>${esc(s.name)}</b></div>
    ${ms.map(m=>{const u=db.users.find(x=>x.id===m.userId);return u?`<div class="access"><b>${esc(u.name||u.email)}</b><small>${esc(u.email)}</small><small class="role">${esc(m.role)}</small><div class="rowBtns"><button class="mini" data-change-role="${m.id}">Cambia ruolo</button><button class="mini danger" data-remove-member="${m.id}">Rimuovi</button></div></div>`:''}).join('')||'<div class="empty">Nessun utente assegnato.</div>'}
    <button class="save" data-invite-site="${s.id}" style="margin-top:12px">+ INVITA UTENTE</button>
  `)
}

function showUserAccess(userId){
  const u=db.users.find(x=>x.id===userId);if(!u)return;
  const ms=db.memberships.filter(m=>m.userId===userId);
  openSheet('ACCESSI UTENTE',`
    <div class="item"><b>${esc(u.name||u.email)}</b><div class="muted">${esc(u.email)}</div></div>
    ${ms.map(m=>{const s=db.sites.find(x=>x.id===m.siteId);return s?`<div class="access"><b>${esc(s.name)}</b><small>Commessa ${esc(s.job)}</small><small class="role">${esc(m.role)}</small></div>`:''}).join('')||'<div class="empty">Nessun accesso.</div>'}
  `)
}

function showRoleForm(id){
  const m=db.memberships.find(x=>x.id===id);if(!m)return;
  openSheet('CAMBIA RUOLO',`<select id="newRole">${roles.map(r=>`<option ${r===m.role?'selected':''}>${r}</option>`).join('')}</select><input type="hidden" id="membershipId" value="${m.id}"><button class="save" data-save="role">SALVA RUOLO</button>`)
}

async function shareInvite(user,site,role){
  const text=`CantiereAI — Invito cantiere\nCommessa: ${site.job}\nCantiere: ${site.name}\nRuolo: ${role}\nUtente: ${user.email}\n\nApri CantiereAI: https://andrea70031.github.io/Cantieri-AI/`;
  try{
    if(navigator.share){await navigator.share({title:'Invito CantiereAI',text});showToast('Invito condiviso')}
    else if(navigator.clipboard){await navigator.clipboard.writeText(text);showToast('Invito copiato negli appunti')}
    else{alert(text)}
  }catch(e){showToast('Invito creato')}
}

nav.addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(b)setPage(b.dataset.page)});
plus.addEventListener('click',()=>{if(page==='sites')showSiteForm();else if(page==='team')showInviteForm();else openSheet('AZIONE RAPIDA','<button class="save" data-open="site">+ Nuovo cantiere</button><button class="ghost" data-open="invite">+ Invita utente</button>')});
document.getElementById('closeSheet').addEventListener('click',closeSheet);
sheet.addEventListener('click',e=>{if(e.target===sheet)closeSheet()});

document.addEventListener('click',async e=>{
  const open=e.target.closest('[data-open]');
  if(open){open.dataset.open==='site'?showSiteForm():showInviteForm();return}

  const inviteSite=e.target.closest('[data-invite-site]');
  if(inviteSite){showInviteForm(inviteSite.dataset.inviteSite);return}

  const change=e.target.closest('[data-change-role]');
  if(change){showRoleForm(change.dataset.changeRole);return}

  const remove=e.target.closest('[data-remove-member]');
  if(remove){
    db.memberships=db.memberships.filter(m=>m.id!==remove.dataset.removeMember);persist();closeSheet();render();showToast('Accesso rimosso');return;
  }

  const action=e.target.closest('[data-action]');
  if(action){
    const id=action.dataset.id;
    if(action.dataset.action==='manage-site'){showSiteAccess(id);return}
    if(action.dataset.action==='user-access'){showUserAccess(id);return}
    if(action.dataset.action==='delete-site'){
      if(confirm('Eliminare questo cantiere?')){db.sites=db.sites.filter(s=>s.id!==id);db.memberships=db.memberships.filter(m=>m.siteId!==id);persist();render();showToast('Cantiere eliminato')}
      return;
    }
    if(action.dataset.action==='save-profile'){
      db.currentUser.name=document.getElementById('pName').value.trim()||'Utente';
      db.currentUser.email=document.getElementById('pEmail').value.trim();
      persist();render();showToast('Profilo salvato');return;
    }
  }

  const saver=e.target.closest('[data-save]');
  if(!saver)return;

  if(saver.dataset.save==='site'){
    const job=document.getElementById('sJob').value.trim(),name=document.getElementById('sName').value.trim();
    if(!job||!name){showToast('Inserisci commessa e nome');return}
    db.sites.push({id:uid(),job,name,client:document.getElementById('sClient').value.trim()});
    persist();closeSheet();setPage('sites');showToast('Cantiere creato');return;
  }

  if(saver.dataset.save==='invite'){
    const email=document.getElementById('uEmail').value.trim();
    const name=document.getElementById('uName').value.trim();
    const siteId=document.getElementById('inviteSiteId').value;
    const role=document.getElementById('uRole').value;
    if(!email||!siteId){showToast('Inserisci email e cantiere');return}
    let user=db.users.find(x=>(x.email||'').toLowerCase()===email.toLowerCase());
    if(!user){user={id:uid(),name,email};db.users.push(user)}else if(name){user.name=name}
    let m=db.memberships.find(x=>x.siteId===siteId&&x.userId===user.id);
    if(m)m.role=role;else db.memberships.push({id:uid(),siteId,userId:user.id,role});
    persist();
    const site=db.sites.find(x=>x.id===siteId);
    closeSheet();setPage('team');showToast('Invito creato');
    if(site)await shareInvite(user,site,role);
    return;
  }

  if(saver.dataset.save==='role'){
    const id=document.getElementById('membershipId').value;
    const m=db.memberships.find(x=>x.id===id);
    if(m){m.role=document.getElementById('newRole').value;persist();closeSheet();render();showToast('Ruolo aggiornato')}
  }
});

if('serviceWorker' in navigator){
  navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister())).catch(()=>{});
}
if('caches' in window){caches.keys().then(keys=>keys.forEach(k=>caches.delete(k))).catch(()=>{})}

persist();render();
})();
</script>
</body>
</html>
