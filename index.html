<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071017">
<title>CantiereAI V4</title>
<style>
:root{
  --bg:#071017;--panel:#0d1821;--panel2:#102431;--cyan:#37d7ff;--amber:#ff9d18;
  --text:#eef8fb;--muted:#8ca4ae;--red:#ff5e64;--green:#4ae0a0;--line:rgba(55,215,255,.22)
}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.08;background-image:linear-gradient(rgba(55,215,255,.16) 1px,transparent 1px),linear-gradient(90deg,rgba(55,215,255,.16) 1px,transparent 1px);background-size:32px 32px}
main{max-width:760px;margin:auto;padding:calc(env(safe-area-inset-top) + 18px) 16px 120px;position:relative;z-index:1;min-height:100vh}
header{display:flex;justify-content:space-between;align-items:center}.brand small{color:var(--cyan);font-size:10px;letter-spacing:3px;font-weight:900}.brand h1{margin:4px 0 0;font-size:30px}.core{width:54px;height:54px;border:2px solid var(--amber);border-radius:50%;display:grid;place-items:center;box-shadow:0 0 24px rgba(255,157,24,.25)}.core:after{content:"";width:28px;height:28px;border-radius:50%;background:var(--amber);box-shadow:0 0 22px rgba(255,157,24,.55)}
.hudline{height:1px;background:linear-gradient(90deg,var(--cyan),transparent);margin:18px 0}.section{margin-top:22px}.section h3{font-size:14px;color:var(--cyan);letter-spacing:3px}.card,.item,.empty{background:linear-gradient(180deg,rgba(16,36,49,.94),rgba(10,24,33,.94));border:1px solid var(--line);border-radius:18px;padding:16px}.item{margin:9px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.num{font-size:34px;font-weight:900}.lab{font-size:10px;color:var(--muted);font-weight:900;letter-spacing:1px}.job{color:var(--amber);font-size:12px;font-weight:900}.muted{color:var(--muted);font-size:14px;margin-top:4px}.kicker{display:flex;justify-content:space-between;gap:10px;align-items:center}.pill{font-size:11px;padding:5px 8px;border-radius:999px;background:var(--panel2);border:1px solid var(--line)}.role{color:var(--cyan)}.danger{color:var(--red)}.ok{color:var(--green)}
button,input,select{font:inherit}button{cursor:pointer}.save,.ghost,.mini{border-radius:12px;padding:12px 14px;font-weight:800}.save{width:100%;border:0;background:linear-gradient(90deg,#ff8d0a,#ffb22d);color:#111}.ghost{width:100%;border:1px solid var(--line);background:var(--panel);color:var(--text);margin-top:8px}.mini{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:8px 10px}.rowBtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
input,select{width:100%;padding:14px;margin:5px 0 12px;border-radius:12px;border:1px solid var(--line);background:#061019;color:white;font-size:16px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;background:#09131bea;backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:7px 0 calc(env(safe-area-inset-bottom) + 6px);z-index:20}nav button{border:0;background:none;color:var(--muted);padding:9px 12px;font-size:11px;font-weight:700}nav .on{color:var(--amber)}
#plus{position:fixed;right:20px;bottom:88px;width:62px;height:62px;border-radius:50%;border:1px solid #ffbd5b;background:var(--amber);font-size:30px;font-weight:800;z-index:21;box-shadow:0 0 24px rgba(255,157,24,.35)}
#sheet{position:fixed;inset:0;background:#000b;display:none;align-items:flex-end;z-index:40}#sheet.open{display:flex}.sheetBox{width:100%;max-height:90vh;overflow:auto;background:#09141c;border-radius:26px 26px 0 0;border-top:1px solid var(--cyan);padding:18px 16px calc(env(safe-area-inset-bottom) + 20px)}.sheetTop{display:flex;justify-content:space-between;align-items:center}.sheetTop b{color:var(--cyan);font-size:18px;letter-spacing:1px}.close{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:8px 11px}
.usercard{display:flex;align-items:center;gap:12px}.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--panel2);border:1px solid var(--line);font-weight:900;color:var(--amber)}.grow{flex:1}
.access{padding:10px 12px;border-radius:14px;background:#09131b;border:1px solid var(--line);margin-top:8px}.access b{font-size:13px}.access small{display:block;color:var(--muted);margin-top:3px}
.notice{padding:12px;border-radius:14px;border:1px solid rgba(255,157,24,.3);background:rgba(255,157,24,.08);font-size:13px;color:#ffd797}
</style>
</head>
<body>
<main id="app"></main>
<button id="plus">+</button>
<nav id="nav">
  <button class="on" data-page="home">⌂<br>HOME</button>
  <button data-page="sites">▣<br>CANTIERI</button>
  <button data-page="team">◉<br>TEAM</button>
  <button data-page="profile">⚙<br>PROFILO</button>
</nav>

<div id="sheet"><div class="sheetBox"><div class="sheetTop"><b id="sheetTitle">NUOVO</b><button class="close" id="closeSheet">Chiudi</button></div><div id="sheetBody"></div></div></div>

<script>
(function(){
  let page='home';
  const roles=['Amministratore','Project Manager','Capocantiere','Montatore','Ufficio tecnico','Direzione lavori','Cliente','Solo visualizzazione'];

  function load(){
    let d;
    try{d=JSON.parse(localStorage.getItem('cantiereAI_v4')||'null')}catch(e){}
    if(!d)d={sites:[],users:[],memberships:[],currentUser:{id:'me',name:'Andrea',email:'',role:'Amministratore'}};
    d.sites=d.sites||[]; d.users=d.users||[]; d.memberships=d.memberships||[];
    return d;
  }
  let db=load();
  const save=()=>localStorage.setItem('cantiereAI_v4',JSON.stringify(db));
  const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  const app=document.getElementById('app'),nav=document.getElementById('nav'),plus=document.getElementById('plus'),sheet=document.getElementById('sheet'),sheetTitle=document.getElementById('sheetTitle'),sheetBody=document.getElementById('sheetBody');

  function head(content){app.innerHTML=`<header><div class="brand"><small>JARVIS CONSTRUCTION OS</small><h1>CANTIERE AI</h1></div><div class="core"></div></header><div class="hudline"></div>${content}`}
  function setPage(p){page=p;[...nav.querySelectorAll('button')].forEach(b=>b.classList.toggle('on',b.dataset.page===p));render()}
  function openSheet(title,html){sheetTitle.textContent=title;sheetBody.innerHTML=html;sheet.classList.add('open')}
  function closeSheet(){sheet.classList.remove('open')}

  function render(){
    if(page==='home')renderHome();
    if(page==='sites')renderSites();
    if(page==='team')renderTeam();
    if(page==='profile')renderProfile();
  }

  function renderHome(){
    const visibleSites=getVisibleSites();
    head(`
      <div class="grid">
        <div class="card"><div class="num">${visibleSites.length}</div><div class="lab">CANTIERI VISIBILI</div></div>
        <div class="card"><div class="num">${db.users.length}</div><div class="lab">UTENTI TEAM</div></div>
      </div>
      <div class="section"><h3>ACCESSO UTENTE</h3>
        <div class="item usercard">
          <div class="avatar">${esc((db.currentUser.name||'U').slice(0,1).toUpperCase())}</div>
          <div class="grow"><b>${esc(db.currentUser.name||'Utente')}</b><div class="muted">${esc(db.currentUser.role||'Utente')}</div></div>
          <span class="pill role">ONLINE</span>
        </div>
      </div>
      <div class="section"><h3>I TUOI CANTIERI</h3>
        ${visibleSites.map(site=>{
          const m=db.memberships.filter(x=>x.siteId===site.id);
          return `<div class="item"><div class="kicker"><b>${esc(site.name)}</b><span class="job">${esc(site.job)}</span></div><div class="muted">${esc(site.client||'')}</div><div class="muted">${m.length} utenti con accesso</div></div>`;
        }).join('')||'<div class="empty">Nessun cantiere.</div>'}
      </div>
      <div class="notice">V4 Multi User: questa interfaccia è pronta per ruoli e permessi. La condivisione reale tra telefoni richiederà il collegamento a un database cloud.</div>
    `)
  }

  function renderSites(){
    head(`<div class="section"><h3>CANTIERI & ACCESSI</h3>
      ${db.sites.map(site=>{
        const members=db.memberships.filter(m=>m.siteId===site.id);
        return `<div class="item">
          <div class="kicker"><b>${esc(site.name)}</b><span class="job">${esc(site.job)}</span></div>
          <div class="muted">${esc(site.client||'')}</div>
          <div class="rowBtns"><button class="mini" data-action="manage-site" data-id="${site.id}">TEAM ACCESS (${members.length})</button><button class="mini danger" data-action="delete-site" data-id="${site.id}">Elimina</button></div>
        </div>`
      }).join('')||'<div class="empty">Nessun cantiere.</div>'}
    </div>`)
  }

  function renderTeam(){
    head(`<div class="section"><h3>TEAM DIRECTORY</h3>
      ${db.users.map(u=>{
        const count=db.memberships.filter(m=>m.userId===u.id).length;
        return `<div class="item usercard">
          <div class="avatar">${esc((u.name||u.email||'U').slice(0,1).toUpperCase())}</div>
          <div class="grow"><b>${esc(u.name||u.email)}</b><div class="muted">${esc(u.email)}</div><div class="muted">${count} cantieri assegnati</div></div>
          <button class="mini" data-action="user-access" data-id="${u.id}">Accessi</button>
        </div>`
      }).join('')||'<div class="empty">Nessun utente invitato.</div>'}
    </div>`)
  }

  function renderProfile(){
    head(`<div class="section"><h3>PROFILO UTENTE</h3>
      <div class="item">
        <label class="muted">Nome</label><input id="pName" value="${esc(db.currentUser.name||'')}">
        <label class="muted">Email</label><input id="pEmail" value="${esc(db.currentUser.email||'')}">
        <label class="muted">Ruolo globale</label><select id="pRole">${roles.map(r=>`<option ${r===db.currentUser.role?'selected':''}>${r}</option>`).join('')}</select>
        <button class="save" data-action="save-profile">SALVA PROFILO</button>
      </div>
    </div>`)
  }

  function getVisibleSites(){
    if(db.currentUser.role==='Amministratore')return db.sites;
    return db.sites.filter(s=>db.memberships.some(m=>m.siteId===s.id&&m.userId===db.currentUser.id));
  }

  function showSiteForm(){
    openSheet('NUOVO CANTIERE',`
      <input id="sJob" placeholder="Numero commessa">
      <input id="sName" placeholder="Nome cantiere">
      <input id="sClient" placeholder="Cliente">
      <button class="save" data-save="site">SALVA</button>
    `)
  }

  function showInviteForm(siteId=''){
    openSheet('INVITA UTENTE',`
      <input id="uName" placeholder="Nome utente">
      <input id="uEmail" type="email" placeholder="Email">
      ${siteId?`<input type="hidden" id="inviteSiteId" value="${siteId}">`:`
      <select id="inviteSiteId"><option value="">Seleziona cantiere</option>${db.sites.map(s=>`<option value="${s.id}">${esc(s.job)} — ${esc(s.name)}</option>`).join('')}</select>`}
      <select id="uRole">${roles.filter(r=>r!=='Amministratore').map(r=>`<option>${r}</option>`).join('')}</select>
      <button class="save" data-save="invite">CREA INVITO</button>
    `)
  }

  function showSiteAccess(siteId){
    const site=db.sites.find(s=>s.id===siteId); if(!site)return;
    const members=db.memberships.filter(m=>m.siteId===siteId);
    openSheet('TEAM ACCESS',`
      <div class="item"><div class="job">COMMESSA ${esc(site.job)}</div><b>${esc(site.name)}</b></div>
      ${members.map(m=>{
        const u=db.users.find(x=>x.id===m.userId); if(!u)return '';
        return `<div class="access"><b>${esc(u.name||u.email)}</b><small>${esc(u.email)}</small><small class="role">${esc(m.role)}</small><div class="rowBtns"><button class="mini" data-change-role="${m.id}">Cambia ruolo</button><button class="mini danger" data-remove-member="${m.id}">Rimuovi</button></div></div>`
      }).join('')||'<div class="empty">Nessun utente assegnato.</div>'}
      <button class="save" data-invite-site="${siteId}" style="margin-top:12px">+ INVITA UTENTE</button>
    `)
  }

  function showUserAccess(userId){
    const u=db.users.find(x=>x.id===userId); if(!u)return;
    const memberships=db.memberships.filter(m=>m.userId===userId);
    openSheet('ACCESSI UTENTE',`
      <div class="item"><b>${esc(u.name||u.email)}</b><div class="muted">${esc(u.email)}</div></div>
      ${memberships.map(m=>{
        const site=db.sites.find(s=>s.id===m.siteId); if(!site)return '';
        return `<div class="access"><b>${esc(site.name)}</b><small>Commessa ${esc(site.job)}</small><small class="role">${esc(m.role)}</small></div>`
      }).join('')||'<div class="empty">Nessun accesso assegnato.</div>'}
    `)
  }

  function changeRole(membershipId){
    const m=db.memberships.find(x=>x.id===membershipId); if(!m)return;
    openSheet('CAMBIA RUOLO',`
      <select id="newRole">${roles.filter(r=>r!=='Amministratore').map(r=>`<option ${r===m.role?'selected':''}>${r}</option>`).join('')}</select>
      <input type="hidden" id="membershipId" value="${m.id}">
      <button class="save" data-save="role">SALVA RUOLO</button>
    `)
  }

  nav.addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(b)setPage(b.dataset.page)});
  plus.addEventListener('click',()=>{if(page==='sites')showSiteForm();else if(page==='team')showInviteForm();else openSheet('AZIONE RAPIDA',`<button class="save" data-open="site">+ Nuovo cantiere</button><button class="ghost" data-open="invite">+ Invita utente</button>`)}); 
  document.getElementById('closeSheet').onclick=closeSheet;sheet.addEventListener('click',e=>{if(e.target===sheet)closeSheet()});

  document.addEventListener('click',e=>{
    const open=e.target.closest('[data-open]');if(open){if(open.dataset.open==='site')showSiteForm();if(open.dataset.open==='invite')showInviteForm();return}
    const inv=e.target.closest('[data-invite-site]');if(inv){showInviteForm(inv.dataset.inviteSite);return}
    const roleBtn=e.target.closest('[data-change-role]');if(roleBtn){changeRole(roleBtn.dataset.changeRole);return}
    const rem=e.target.closest('[data-remove-member]');if(rem){db.memberships=db.memberships.filter(m=>m.id!==rem.dataset.removeMember);save();closeSheet();render();return}

    const action=e.target.closest('[data-action]');
    if(action){
      if(action.dataset.action==='manage-site')showSiteAccess(action.dataset.id);
      if(action.dataset.action==='user-access')showUserAccess(action.dataset.id);
      if(action.dataset.action==='delete-site'){db.sites=db.sites.filter(s=>s.id!==action.dataset.id);db.memberships=db.memberships.filter(m=>m.siteId!==action.dataset.id);save();render()}
      if(action.dataset.action==='save-profile'){db.currentUser.name=document.getElementById('pName').value.trim();db.currentUser.email=document.getElementById('pEmail').value.trim();db.currentUser.role=document.getElementById('pRole').value;save();render()}
      return;
    }

    const saver=e.target.closest('[data-save]');
    if(!saver)return;
    if(saver.dataset.save==='site'){
      const job=document.getElementById('sJob').value.trim(),name=document.getElementById('sName').value.trim();
      if(!job||!name)return alert('Inserisci commessa e nome cantiere.');
      db.sites.push({id:uid(),job,name,client:document.getElementById('sClient').value.trim()});save();closeSheet();setPage('sites');
    }
    if(saver.dataset.save==='invite'){
      const email=document.getElementById('uEmail').value.trim(),name=document.getElementById('uName').value.trim(),siteId=document.getElementById('inviteSiteId').value,role=document.getElementById('uRole').value;
      if(!email||!siteId)return alert('Inserisci email e cantiere.');
      let u=db.users.find(x=>x.email.toLowerCase()===email.toLowerCase());
      if(!u){u={id:uid(),name,email};db.users.push(u)}
      const existing=db.memberships.find(m=>m.siteId===siteId&&m.userId===u.id);
      if(existing)existing.role=role;else db.memberships.push({id:uid(),siteId,userId:u.id,role});
      save();closeSheet();setPage('team');
      alert('Invito creato in demo. Nella versione cloud verrà inviato via email.');
    }
    if(saver.dataset.save==='role'){
      const m=db.memberships.find(x=>x.id===document.getElementById('membershipId').value);if(m)m.role=document.getElementById('newRole').value;save();closeSheet();render();
    }
  });

  render();
})();
</script>
</body>
</html>
