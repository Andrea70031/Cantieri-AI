<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071017">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CantiereAI">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<title>CantiereAI</title>
<style>
:root{
 --bg:#071017;--bg2:#09141c;--panel:#0d1821;--panel2:#102431;--cyan:#37d7ff;--amber:#ff9d18;
 --text:#eff8fb;--muted:#8ca4ae;--red:#ff5e64;--green:#4ae0a0;--line:rgba(55,215,255,.22);
 --shadow:0 18px 50px rgba(0,0,0,.32)
}
*{box-sizing:border-box} html{background:var(--bg)} body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,sans-serif}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.065;background-image:linear-gradient(rgba(55,215,255,.18) 1px,transparent 1px),linear-gradient(90deg,rgba(55,215,255,.18) 1px,transparent 1px);background-size:32px 32px}
button,input,select,textarea{font:inherit} button{cursor:pointer;-webkit-tap-highlight-color:transparent}
main{max-width:820px;margin:auto;min-height:100vh;padding:calc(env(safe-area-inset-top) + 15px) 15px 118px;position:relative;z-index:1}
header{display:flex;justify-content:space-between;align-items:center;gap:14px}
.brand small{font-size:9px;letter-spacing:2.8px;color:var(--cyan);font-weight:900}.brand h1{margin:3px 0 0;font-size:29px;line-height:1}
.core{width:50px;height:50px;border:2px solid var(--amber);border-radius:50%;display:grid;place-items:center;box-shadow:0 0 24px rgba(255,157,24,.25)}
.core:after{content:"";width:25px;height:25px;background:var(--amber);border-radius:50%;box-shadow:0 0 20px rgba(255,157,24,.65)}
.hudline{height:1px;background:linear-gradient(90deg,var(--cyan),transparent);margin:17px 0}
.card,.item,.empty,.notice{background:linear-gradient(180deg,rgba(16,36,49,.95),rgba(10,24,33,.95));border:1px solid var(--line);border-radius:17px;padding:15px;box-shadow:0 8px 28px rgba(0,0,0,.12)}
.item{margin:8px 0}.empty{text-align:center;color:var(--muted);padding:25px 14px}.notice{border-color:rgba(255,157,24,.28);background:rgba(255,157,24,.075);color:#ffd89f;font-size:13px;line-height:1.45}
.section{margin-top:21px}.section h3{font-size:12px;letter-spacing:2.4px;color:var(--cyan);margin:0 0 10px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.metric .num{font-size:30px;font-weight:900}.metric .lab{font-size:9px;color:var(--muted);font-weight:900;letter-spacing:.9px;margin-top:3px}
.kicker,.spread{display:flex;align-items:center;justify-content:space-between;gap:10px}.grow{flex:1;min-width:0}.job{color:var(--amber);font-size:11px;font-weight:900;letter-spacing:.4px}
.muted{color:var(--muted);font-size:13px;line-height:1.4;margin-top:4px}.tiny{font-size:11px;color:var(--muted)}.role{color:var(--cyan)}.danger{color:var(--red)}.ok{color:var(--green)}.amber{color:var(--amber)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:5px 8px;border-radius:999px;border:1px solid var(--line);font-size:10px;font-weight:800;background:rgba(16,36,49,.85)}.pill.red{border-color:rgba(255,94,100,.35);color:#ff8c91}.pill.green{border-color:rgba(74,224,160,.32);color:var(--green)}.pill.orange{border-color:rgba(255,157,24,.35);color:#ffc16b}
.progress{height:7px;background:#050d12;border-radius:99px;overflow:hidden;margin-top:10px}.progress i{display:block;height:100%;background:linear-gradient(90deg,#0bb5d6,var(--cyan))}
.save,.ghost,.mini,.iconBtn{border-radius:11px;font-weight:800}.save{border:0;background:linear-gradient(90deg,#ff8d0a,#ffb22d);color:#111;padding:13px 14px;width:100%}.ghost{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:12px 13px;width:100%}.mini{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:8px 10px;font-size:12px}.iconBtn{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:9px 11px}
.rowBtns{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
input,select,textarea{width:100%;padding:13px;margin:5px 0 11px;border-radius:11px;border:1px solid var(--line);background:#061019;color:white;font-size:16px;outline:none}
textarea{min-height:88px;resize:vertical} input:focus,select:focus,textarea:focus{border-color:var(--cyan)}
label.flabel{font-size:11px;color:var(--muted);font-weight:700}
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;background:rgba(7,16,23,.94);backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:5px 0 calc(env(safe-area-inset-bottom) + 5px)}
nav button{border:0;background:none;color:var(--muted);min-width:64px;padding:8px 8px 7px;font-size:9.5px;font-weight:800}nav button span{display:block;font-size:20px;line-height:19px;margin-bottom:3px}nav .on{color:var(--amber)}
#fab{position:fixed;right:18px;bottom:85px;z-index:32;width:58px;height:58px;border-radius:50%;border:1px solid #ffd082;background:var(--amber);font-size:29px;font-weight:900;color:#101010;box-shadow:0 0 26px rgba(255,157,24,.38)}
#sheet{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.72);display:none;align-items:flex-end}#sheet.open{display:flex}.sheetBox{width:100%;max-height:92vh;overflow:auto;background:#08131b;border-radius:25px 25px 0 0;border-top:1px solid var(--cyan);padding:17px 15px calc(env(safe-area-inset-bottom) + 18px);box-shadow:var(--shadow)}
.sheetTop{display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:-17px;background:#08131b;padding:17px 0 10px;z-index:2}.sheetTop b{color:var(--cyan);letter-spacing:1px}.close{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:10px;padding:8px 10px}
.toast{position:fixed;left:50%;bottom:130px;transform:translateX(-50%);z-index:100;background:#0c1b24;border:1px solid var(--cyan);border-radius:11px;padding:10px 13px;display:none;max-width:92%;text-align:center;box-shadow:var(--shadow);font-size:13px}.toast.show{display:block}
.login{max-width:430px;margin:7vh auto 0}.loginLogo{text-align:center;margin-bottom:20px}.loginLogo img{width:86px;height:86px;border-radius:20px;box-shadow:0 14px 40px rgba(0,0,0,.35)}.loginLogo h1{font-size:34px;margin:8px 0 2px}.loginLogo small{color:var(--cyan);letter-spacing:2.5px}.tabsAuth{display:flex;gap:7px;margin-bottom:12px}.tabsAuth button{flex:1;border:1px solid var(--line);background:var(--panel);color:var(--muted);padding:10px;border-radius:10px}.tabsAuth .active{background:var(--amber);border-color:var(--amber);color:#111}
.siteTabs{display:flex;gap:7px;overflow:auto;padding:2px 0 8px;scrollbar-width:none}.siteTabs::-webkit-scrollbar{display:none}.siteTabs button{flex:0 0 auto;border:1px solid var(--line);background:var(--panel);color:var(--muted);padding:9px 11px;border-radius:999px;font-size:11px;font-weight:800}.siteTabs .active{color:#101010;background:var(--cyan);border-color:var(--cyan)}
.searchbar{display:flex;gap:7px}.searchbar input{margin:0}.searchbar select{width:140px;margin:0}
.photoGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.photo{aspect-ratio:1;background:#061019;border-radius:12px;overflow:hidden;border:1px solid var(--line);position:relative}.photo img{width:100%;height:100%;object-fit:cover}.photo span{position:absolute;left:5px;right:5px;bottom:5px;background:rgba(0,0,0,.65);padding:4px;border-radius:6px;font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fileRow{display:flex;align-items:center;gap:10px}.fileIcon{width:38px;height:38px;border-radius:10px;background:var(--panel2);display:grid;place-items:center;color:var(--cyan);font-weight:900}
.aiHero{position:relative;overflow:hidden}.aiHero:after{content:"AI";position:absolute;right:-5px;top:-30px;font-size:100px;font-weight:900;color:rgba(55,215,255,.045)}.chat{display:flex;flex-direction:column;gap:9px;min-height:250px}.bubble{max-width:88%;padding:11px 12px;border-radius:15px;line-height:1.42;font-size:13px;white-space:pre-wrap}.bubble.user{align-self:flex-end;background:rgba(255,157,24,.14);border:1px solid rgba(255,157,24,.3)}.bubble.ai{align-self:flex-start;background:rgba(55,215,255,.08);border:1px solid var(--line)}.chatInput{display:grid;grid-template-columns:auto 1fr auto;gap:6px;align-items:end}.chatInput textarea{margin:0;min-height:49px;max-height:130px}.chatInput button{height:49px;min-width:49px}
.chips{display:flex;gap:6px;overflow:auto;padding-bottom:4px}.chips button{flex:0 0 auto;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:999px;padding:8px 10px;font-size:11px}
.attention{border-left:3px solid var(--red)}.quick{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.quick button{text-align:left}
.issueCard{border-left:3px solid rgba(255,157,24,.7)}.issueCard.critical{border-left-color:var(--red)}
.userRow{display:flex;align-items:center;gap:10px}.avatar{width:39px;height:39px;border-radius:50%;display:grid;place-items:center;background:var(--panel2);border:1px solid var(--line);font-weight:900;color:var(--amber);flex:0 0 auto}
.net{position:fixed;right:9px;top:calc(env(safe-area-inset-top) + 5px);z-index:90;font-size:9px;border-radius:99px;padding:4px 7px;background:#071017;border:1px solid var(--line);color:var(--green)}
.net.off{color:var(--red);border-color:rgba(255,94,100,.3)}
.hidden{display:none!important}.loading{text-align:center;color:var(--cyan);padding:34px}.spinner{display:inline-block;width:18px;height:18px;border:2px solid rgba(55,215,255,.25);border-top-color:var(--cyan);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:390px){main{padding-left:12px;padding-right:12px}.brand h1{font-size:26px}.grid3{grid-template-columns:1fr 1fr}.photoGrid{grid-template-columns:repeat(2,1fr)}nav button{min-width:57px;padding-left:5px;padding-right:5px}}
@media print{nav,#fab,.net,.noPrint{display:none!important}main{padding:0;color:#111;background:white}.card,.item{background:white;color:#111;border:1px solid #ddd;box-shadow:none}}
</style>
</head>
<body>
<div id="net" class="net">ONLINE</div>
<main id="app"><div class="loading"><span class="spinner"></span><div style="margin-top:9px">AVVIO CANTIEREAI…</div></div></main>
<button id="fab" class="hidden">+</button>
<nav id="nav" class="hidden">
 <button class="on" data-page="home"><span>⌂</span>HOME</button>
 <button data-page="sites"><span>▣</span>CANTIERI</button>
 <button data-page="ai"><span>✦</span>AI COMMAND</button>
 <button data-page="team"><span>◉</span>TEAM</button>
 <button data-page="profile"><span>⚙</span>PROFILO</button>
</nav>
<div id="sheet"><div class="sheetBox"><div class="sheetTop"><b id="sheetTitle"></b><button id="sheetClose" class="close">Chiudi</button></div><div id="sheetBody"></div></div></div>
<div id="toast" class="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(async()=>{
'use strict';
const SUPABASE_URL="https://frehflwcnghrmqpzbpno.supabase.co";
const SUPABASE_KEY="sb_publishable_SuYaTiqS5F9OifFyuadFEA_xkAqQujw";
const APP_URL="https://andrea70031.github.io/Cantieri-AI/";
const VERSION="1.0 FINAL";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const roles=['Amministratore','Project Manager','Capocantiere','Montatore','Ufficio tecnico','Direzione lavori','Cliente','Solo visualizzazione'];
const el=id=>document.getElementById(id);
const app=el('app'),nav=el('nav'),fab=el('fab'),sheet=el('sheet'),sheetTitle=el('sheetTitle'),sheetBody=el('sheetBody'),toast=el('toast'),net=el('net');
let page='home',session=null,profile=null,sites=[],members=[],allIssues=[],siteId=null,siteTab='overview',aiSiteId='',busy=false;

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=d=>d?new Intl.DateTimeFormat('it-IT',{day:'2-digit',month:'2-digit',year:'2-digit'}).format(new Date(d)):'';
const fmtFull=d=>d?new Intl.DateTimeFormat('it-IT',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}).format(new Date(d)):'';
const uid=()=>crypto.randomUUID?.()||Date.now().toString(36)+Math.random().toString(36).slice(2);
function msg(t){toast.textContent=t;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),2400)}
function openSheet(title,html){sheetTitle.textContent=title;sheetBody.innerHTML=html;sheet.classList.add('open')}
function closeSheet(){sheet.classList.remove('open')}
function loading(){app.innerHTML='<div class="loading"><span class="spinner"></span><div style="margin-top:9px">SINCRONIZZAZIONE…</div></div>'}
function header(content){app.innerHTML=`<header><div class="brand"><small>CONSTRUCTION OPERATING SYSTEM · ${VERSION}</small><h1>CANTIERE AI</h1></div><div class="core"></div></header><div class="hudline"></div>${content}`}
function roleFor(id){return members.find(m=>m.site_id===id&&m.user_id===session?.user?.id)?.role||''}
const canManage=id=>['Amministratore','Project Manager'].includes(roleFor(id));
const canSupervise=id=>['Amministratore','Project Manager','Capocantiere'].includes(roleFor(id));
const canContribute=id=>['Amministratore','Project Manager','Capocantiere','Montatore','Ufficio tecnico','Direzione lavori'].includes(roleFor(id));
const canReport=id=>['Amministratore','Project Manager','Capocantiere'].includes(roleFor(id));
const canPhoto=id=>['Amministratore','Project Manager','Capocantiere','Montatore','Ufficio tecnico'].includes(roleFor(id));
const canDoc=id=>['Amministratore','Project Manager','Capocantiere','Ufficio tecnico'].includes(roleFor(id));

window.addEventListener('online',()=>{net.textContent='ONLINE';net.classList.remove('off')});
window.addEventListener('offline',()=>{net.textContent='OFFLINE';net.classList.add('off')});
if(!navigator.onLine){net.textContent='OFFLINE';net.classList.add('off')}

async function loadBase(){
 const uid=session.user.id;
 const [p,s,m,i]=await Promise.all([
  sb.from('profiles').select('*').eq('id',uid).maybeSingle(),
  sb.from('sites').select('*').order('created_at',{ascending:false}),
  sb.from('site_members').select('*'),
  sb.from('issues').select('id,site_id,title,details,priority,status,assigned_to,due_at,created_at').neq('status','Risolto').order('created_at',{ascending:false})
 ]);
 profile=p.data||{id:uid,email:session.user.email,full_name:session.user.user_metadata?.full_name||''};
 sites=s.data||[];members=m.data||[];allIssues=i.data||[];
}

function showAuth(mode='login'){
 nav.classList.add('hidden');fab.classList.add('hidden');
 app.innerHTML=`<div class="login">
  <div class="loginLogo"><img src="./app-icon-192.png"><small>CANTIEREAI CLOUD</small><h1>${mode==='login'?'ACCESSO':'REGISTRAZIONE'}</h1></div>
  <div class="item">
   <div class="tabsAuth"><button class="${mode==='login'?'active':''}" data-auth-tab="login">Accedi</button><button class="${mode==='signup'?'active':''}" data-auth-tab="signup">Registrati</button></div>
   ${mode==='signup'?'<label class="flabel">Nome e cognome</label><input id="authName" autocomplete="name" placeholder="Nome e cognome">':''}
   <label class="flabel">Email</label><input id="authEmail" type="email" autocomplete="email" placeholder="nome@azienda.it">
   <label class="flabel">Password</label><input id="authPassword" type="password" autocomplete="${mode==='login'?'current-password':'new-password'}" placeholder="Minimo 6 caratteri">
   <button class="save" data-auth-action="${mode}">${mode==='login'?'ACCEDI':'CREA ACCOUNT'}</button>
   <div class="muted" style="margin-top:11px">${mode==='signup'?'Se hai ricevuto un invito, registrati con la stessa email.':'I dati sono sincronizzati e protetti da permessi per singola commessa.'}</div>
  </div></div>`;
}

async function setPage(p){
 page=p;siteId=null;siteTab='overview';
 nav.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('on',b.dataset.page===p));
 await render();
}
async function render(){
 if(!session)return showAuth();
 nav.classList.remove('hidden');fab.classList.remove('hidden');
 if(siteId)return renderSite();
 if(page==='home')return renderHome();
 if(page==='sites')return renderSites();
 if(page==='ai')return renderAI();
 if(page==='team')return renderTeam();
 if(page==='profile')return renderProfile();
}

function renderHome(){
 const critical=allIssues.filter(i=>i.priority==='Critica');
 const high=allIssues.filter(i=>i.priority==='Alta');
 const avg=sites.length?Math.round(sites.reduce((a,s)=>a+(Number(s.progress)||0),0)/sites.length):0;
 const attention=[...critical,...high].slice(0,5);
 header(`<div class="grid3">
  <div class="card metric"><div class="num">${sites.length}</div><div class="lab">CANTIERI</div></div>
  <div class="card metric"><div class="num">${allIssues.length}</div><div class="lab">PROBLEMI APERTI</div></div>
  <div class="card metric"><div class="num">${avg}%</div><div class="lab">AVANZAMENTO MEDIO</div></div>
 </div>
 <div class="section"><h3>COMMAND CENTER</h3><div class="quick">
  <button class="ghost" data-quick="site"><b>＋ Nuovo cantiere</b><div class="muted">Crea una nuova commessa</div></button>
  <button class="ghost" data-quick="ai"><b>✦ Chiedi all'AI</b><div class="muted">Analizza tutti i cantieri</div></button>
  <button class="ghost" data-quick="issue"><b>⚠ Segnala problema</b><div class="muted">Scegli la commessa</div></button>
  <button class="ghost" data-quick="report"><b>▤ Report giornaliero</b><div class="muted">Registra la giornata</div></button>
 </div></div>
 <div class="section"><h3>RICHIEDE ATTENZIONE</h3>
  ${attention.map(i=>{const s=sites.find(x=>x.id===i.site_id);return `<div class="item attention" data-open-site="${i.site_id}"><div class="spread"><b>${esc(i.title)}</b><span class="pill ${i.priority==='Critica'?'red':'orange'}">${esc(i.priority)}</span></div><div class="job">${esc(s?.job_number||'')} · ${esc(s?.name||'')}</div><div class="muted">${esc(i.details||'')}</div></div>`}).join('')||'<div class="empty">Nessuna criticità ad alta priorità.</div>'}
 </div>
 <div class="section"><h3>CANTIERI RECENTI</h3>
 ${sites.slice(0,5).map(siteCard).join('')||'<div class="empty">Nessun cantiere. Premi + per iniziare.</div>'}</div>`);
}
function siteCard(s){
 return `<div class="item" data-open-site="${s.id}">
  <div class="spread"><div class="grow"><b>${esc(s.name)}</b><div class="job">${esc(s.job_number)}</div></div><span class="pill ${s.status==='Completato'?'green':s.status==='In pausa'?'orange':''}">${esc(s.status)}</span></div>
  <div class="muted">${esc(s.client||'')}${s.address?' · '+esc(s.address):''}</div>
  <div class="progress"><i style="width:${Number(s.progress)||0}%"></i></div>
  <div class="spread" style="margin-top:8px"><span class="tiny">${Number(s.progress)||0}% completato</span><span class="tiny role">${esc(roleFor(s.id))}</span></div>
 </div>`;
}
function renderSites(){
 header(`<div class="section"><h3>CANTIERI</h3>
  <div class="searchbar"><input id="siteSearch" placeholder="Cerca commessa, cantiere, cliente…"><select id="siteFilter"><option value="">Tutti</option><option>Attivo</option><option>In pausa</option><option>Completato</option></select></div>
  <div id="siteList" style="margin-top:10px">${sites.map(siteCard).join('')||'<div class="empty">Nessun cantiere.</div>'}</div>
 </div>`);
}

async function renderSite(){
 const s=sites.find(x=>x.id===siteId);if(!s){siteId=null;return setPage('sites')}
 header(`<div class="spread"><button class="mini noPrint" data-back-sites>← Cantieri</button><div class="rowBtns noPrint"><button class="mini" data-share-site="${s.id}">Condividi</button>${s.address?`<button class="mini" data-map="${esc(s.address)}">Mappa</button>`:''}</div></div>
 <div class="section"><div class="item"><div class="spread"><div class="grow"><div class="job">COMMESSA ${esc(s.job_number)}</div><h2 style="margin:4px 0">${esc(s.name)}</h2></div><span class="pill">${esc(s.status)}</span></div><div class="muted">${esc(s.client||'')}${s.address?' · '+esc(s.address):''}</div><div class="progress"><i style="width:${Number(s.progress)||0}%"></i></div><div class="spread" style="margin-top:8px"><span class="tiny">${Number(s.progress)||0}%</span><span class="tiny role">${esc(roleFor(s.id))}</span></div></div></div>
 <div class="siteTabs noPrint">
  ${[['overview','PANORAMICA'],['activities','ATTIVITÀ'],['issues','PROBLEMI'],['files','FILE & FOTO'],['reports','REPORT'],['team','TEAM']].map(([v,l])=>`<button data-site-tab="${v}" class="${siteTab===v?'active':''}">${l}</button>`).join('')}
 </div><div id="sitePane"><div class="loading"><span class="spinner"></span></div></div>`);
 await renderSitePane(s);
}

async function renderSitePane(s){
 const pane=el('sitePane');if(!pane)return;
 if(siteTab==='overview'){
  const [a,i,p,d,r]=await Promise.all([
   sb.from('activities').select('*').eq('site_id',s.id).order('created_at',{ascending:false}).limit(4),
   sb.from('issues').select('*').eq('site_id',s.id).order('created_at',{ascending:false}).limit(4),
   sb.from('photos').select('*',{count:'exact',head:true}).eq('site_id',s.id),
   sb.from('documents').select('*',{count:'exact',head:true}).eq('site_id',s.id),
   sb.from('daily_reports').select('*',{count:'exact',head:true}).eq('site_id',s.id)
  ]);

function startVoice(){
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return msg('Dettatura vocale non disponibile su questo browser');
 const rec=new SR();rec.lang='it-IT';rec.interimResults=false;rec.maxAlternatives=1;const b=el('voiceBtn');if(b)b.textContent='●';
 rec.onresult=e=>{if(el('aiInput'))el('aiInput').value=e.results[0][0].transcript};rec.onerror=()=>msg('Non riesco ad ascoltare');rec.onend=()=>{if(b)b.textContent='🎙'};rec.start();
}

nav.addEventListener('click',async e=>{const b=e.target.closest('[data-page]');if(b)await setPage(b.dataset.page)});
fab.addEventListener('click',()=>{if(page==='sites'||page==='home')siteForm();else if(page==='ai')el('aiInput')?.focus();else if(page==='team'){const s=sites.find(x=>canManage(x.id));s?inviteForm(s.id):msg('Nessun cantiere gestibile')}else siteForm()});
el('sheetClose').onclick=closeSheet;sheet.addEventListener('click',e=>{if(e.target===sheet)closeSheet()});

document.addEventListener('input',e=>{
 if(e.target.id==='siteSearch'||e.target.id==='siteFilter'){
  const q=(el('siteSearch')?.value||'').toLowerCase(),f=el('siteFilter')?.value||'';
  const filtered=sites.filter(s=>(!f||s.status===f)&&(!q||[s.job_number,s.name,s.client,s.address].some(v=>String(v||'').toLowerCase().includes(q))));
  const l=el('siteList');if(l)l.innerHTML=filtered.map(siteCard).join('')||'<div class="empty">Nessun risultato.</div>';
 }
});
document.addEventListener('change',async e=>{if(e.target.id==='aiSite'){aiSiteId=e.target.value;await loadAIHistory()}});

document.addEventListener('click',async e=>{
 let x=e.target.closest('[data-auth-tab]');if(x)return showAuth(x.dataset.authTab);
 x=e.target.closest('[data-auth-action]');if(x){
  const email=el('authEmail').value.trim(),password=el('authPassword').value;if(!email||password.length<6)return msg('Controlla email e password');
  if(x.dataset.authAction==='login'){const r=await sb.auth.signInWithPassword({email,password});if(r.error)return msg(r.error.message);session=r.data.session;loading();await loadBase();nav.classList.remove('hidden');fab.classList.remove('hidden');await render();return msg('Accesso eseguito')}
  const full_name=el('authName').value.trim(),r=await sb.auth.signUp({email,password,options:{data:{full_name}}});if(r.error)return msg(r.error.message);if(r.data.session){session=r.data.session;await loadBase();await render()}else showAuth('login');return msg(r.data.session?'Account creato':'Controlla la tua email');
 }
 x=e.target.closest('[data-open-site]');if(x){siteId=x.dataset.openSite;siteTab='overview';return render()}
 if(e.target.closest('[data-back-sites]')){siteId=null;return setPage('sites')}
 x=e.target.closest('[data-site-tab]');if(x){siteTab=x.dataset.siteTab;return renderSite()}
 x=e.target.closest('[data-quick]');if(x){if(x.dataset.quick==='site')return siteForm();if(x.dataset.quick==='ai')return setPage('ai');if(x.dataset.quick==='issue')return chooseSite('issue');if(x.dataset.quick==='report')return chooseSite('report')}
 x=e.target.closest('[data-choose-site]');if(x){const id=x.dataset.chooseSite,a=x.dataset.chooseAction;closeSheet();return a==='issue'?issueForm(id):reportForm(id)}
 x=e.target.closest('[data-edit-site]');if(x)return siteForm(sites.find(s=>s.id===x.dataset.editSite));
 x=e.target.closest('[data-add-activity]');if(x)return activityForm(x.dataset.addActivity);
 x=e.target.closest('[data-add-issue]');if(x)return issueForm(x.dataset.addIssue);
 x=e.target.closest('[data-add-report]');if(x)return reportForm(x.dataset.addReport);
 x=e.target.closest('[data-upload-photo]');if(x)return uploadPhotoForm(x.dataset.uploadPhoto);
 x=e.target.closest('[data-upload-doc]');if(x)return uploadDocForm(x.dataset.uploadDoc);
 x=e.target.closest('[data-invite-user]');if(x)return inviteForm(x.dataset.inviteUser);
 x=e.target.closest('[data-open-issue]');if(x)return issueDetail(x.dataset.openIssue);
 x=e.target.closest('[data-view-report]');if(x)return reportDetail(x.dataset.viewReport);
 x=e.target.closest('[data-open-file]');if(x)return openStorage(x.dataset.openFile);
 x=e.target.closest('[data-map]');if(x){window.open('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(x.dataset.map),'_blank');return}
 x=e.target.closest('[data-share-site]');if(x){const s=sites.find(z=>z.id===x.dataset.shareSite),text=`CantiereAI — ${s?.job_number||''} ${s?.name||''}\n${APP_URL}?site=${x.dataset.shareSite}`;try{if(navigator.share)await navigator.share({title:'CantiereAI',text});else{await navigator.clipboard.writeText(text);msg('Link copiato')}}catch{}return}
 x=e.target.closest('[data-ai-site]');if(x){aiSiteId=x.dataset.aiSite;siteId=null;return setPage('ai')}
 x=e.target.closest('[data-ai-prompt]');if(x){el('aiInput').value=x.dataset.aiPrompt;return sendAI()}
 if(e.target.id==='aiSend')return sendAI();if(e.target.id==='voiceBtn')return startVoice();

 x=e.target.closest('[data-save-site]');if(x){
  const data={job_number:el('fJob').value.trim(),name:el('fName').value.trim(),client:el('fClient').value.trim(),address:el('fAddress').value.trim(),status:el('fStatus').value,progress:Math.max(0,Math.min(100,Number(el('fProgress').value)||0)),notes:el('fNotes').value.trim()};if(!data.job_number||!data.name)return msg('Commessa e nome sono obbligatori');
  const r=x.dataset.saveSite?await sb.from('sites').update(data).eq('id',x.dataset.saveSite):await sb.from('sites').insert({...data,created_by:session.user.id});if(r.error)return msg(r.error.message);closeSheet();await loadBase();siteId=x.dataset.saveSite||null;await (siteId?render():setPage('sites'));return msg('Cantiere salvato');
 }
 if(e.target.closest('[data-save-activity]')){
  const sid=el('actSite').value,title=el('actTitle').value.trim();if(!title)return msg('Inserisci l’attività');const r=await sb.from('activities').insert({site_id:sid,title,notes:el('actNotes').value.trim(),created_by:session.user.id});if(r.error)return msg(r.error.message);closeSheet();siteId=sid;siteTab='activities';await render();return msg('Attività salvata');
 }
 if(e.target.closest('[data-save-issue]')){
  const sid=el('issueSite').value,title=el('issueTitle').value.trim();if(!title)return msg('Inserisci il titolo');const assigned=el('issueAssigned').value||null,due=el('issueDue').value||null;const r=await sb.from('issues').insert({site_id:sid,title,priority:el('issuePriority').value,details:el('issueDetails').value.trim(),assigned_to:assigned,due_at:due,created_by:session.user.id});if(r.error)return msg(r.error.message);closeSheet();await loadBase();siteId=sid;siteTab='issues';await render();return msg('Problema registrato');
 }
 x=e.target.closest('[data-toggle-issue]');if(x){const status=x.dataset.status==='Risolto'?'Aperto':'Risolto',r=await sb.from('issues').update({status}).eq('id',x.dataset.toggleIssue);if(r.error)return msg(r.error.message);closeSheet();await loadBase();await render();return msg(status==='Risolto'?'Problema risolto':'Problema riaperto')}
 x=e.target.closest('[data-delete-issue]');if(x){if(!confirm('Eliminare definitivamente il problema?'))return;const r=await sb.from('issues').delete().eq('id',x.dataset.deleteIssue);if(r.error)return msg(r.error.message);closeSheet();await loadBase();await render();return msg('Problema eliminato')}
 x=e.target.closest('[data-add-comment]');if(x){const body=el('commentBody').value.trim();if(!body)return;const r=await sb.from('issue_comments').insert({issue_id:x.dataset.addComment,body,created_by:session.user.id});if(r.error)return msg(r.error.message);return issueDetail(x.dataset.addComment)}
 x=e.target.closest('[data-delete-activity]');if(x){if(!confirm('Eliminare questa attività?'))return;const r=await sb.from('activities').delete().eq('id',x.dataset.deleteActivity);if(r.error)return msg(r.error.message);return renderSite()}
 if(e.target.closest('[data-save-report]')){const sid=el('repSite').value,r=await sb.from('daily_reports').insert({site_id:sid,report_date:el('repDate').value,workers:Number(el('repWorkers').value)||0,hours:Number(el('repHours').value)||0,works:el('repWorks').value.trim(),blockers:el('repBlockers').value.trim(),summary:el('repSummary').value.trim(),created_by:session.user.id});if(r.error)return msg(r.error.message);closeSheet();siteId=sid;siteTab='reports';await render();return msg('Report salvato')}
 x=e.target.closest('[data-delete-report]');if(x){if(!confirm('Eliminare questo report?'))return;const r=await sb.from('daily_reports').delete().eq('id',x.dataset.deleteReport);if(r.error)return msg(r.error.message);return renderSite()}
 x=e.target.closest('[data-print-report]');if(x)return printReport(x.dataset.printReport);
 if(e.target.closest('[data-save-photo]')){const file=el('photoFile').files[0],sid=el('photoSite').value;if(!file)return msg('Seleziona una foto');e.target.disabled=true;e.target.textContent='CARICAMENTO…';const ext=(file.name.split('.').pop()||'jpg').toLowerCase(),path=`${sid}/photos/${Date.now()}-${uid()}.${ext}`,up=await sb.storage.from('site-files').upload(path,file,{contentType:file.type||'image/jpeg'});if(up.error){e.target.disabled=false;return msg(up.error.message)}const db=await sb.from('photos').insert({site_id:sid,storage_path:path,caption:el('photoCaption').value.trim(),created_by:session.user.id});if(db.error)return msg(db.error.message);closeSheet();siteId=sid;siteTab='files';await render();return msg('Foto caricata')}
 if(e.target.closest('[data-save-doc]')){const file=el('docFile').files[0],sid=el('docSite').value;if(!file)return msg('Seleziona un file');e.target.disabled=true;e.target.textContent='CARICAMENTO…';const clean=file.name.replace(/[^\w.\-]+/g,'_'),path=`${sid}/documents/${Date.now()}-${uid()}-${clean}`,up=await sb.storage.from('site-files').upload(path,file,{contentType:file.type||'application/octet-stream'});if(up.error){e.target.disabled=false;return msg(up.error.message)}const db=await sb.from('documents').insert({site_id:sid,storage_path:path,file_name:file.name,mime_type:file.type,category:el('docCategory').value,created_by:session.user.id});if(db.error)return msg(db.error.message);closeSheet();siteId=sid;siteTab='files';await render();return msg('Documento caricato')}
 if(e.target.closest('[data-send-invite]')){const body={site_id:el('inviteSite').value,email:el('inviteEmail').value.trim(),role:el('inviteRole').value,full_name:el('inviteName').value.trim()};if(!body.email)return msg('Inserisci email');e.target.disabled=true;e.target.textContent='INVIO…';const r=await sb.functions.invoke('invite-site-user',{body});e.target.disabled=false;e.target.textContent='INVIA INVITO';if(r.error||r.data?.error)return msg(r.data?.error||r.error.message);closeSheet();return msg(r.data?.message||'Invito inviato')}
 x=e.target.closest('[data-member-menu]');if(x){openSheet('GESTISCI ACCESSO',`<select id="memberRole">${roles.map(r=>`<option ${r===x.dataset.memberRole?'selected':''}>${r}</option>`).join('')}</select><input type="hidden" id="memberId" value="${x.dataset.memberMenu}"><button class="save" data-save-member-role>SALVA RUOLO</button><button class="ghost danger" data-remove-member>RIMUOVI DAL CANTIERE</button>`);return}
 if(e.target.closest('[data-save-member-role]')){const r=await sb.from('site_members').update({role:el('memberRole').value}).eq('id',el('memberId').value);if(r.error)return msg(r.error.message);closeSheet();await loadBase();return renderSite()}
 if(e.target.closest('[data-remove-member]')){if(!confirm('Rimuovere l’accesso a questo cantiere?'))return;const r=await sb.from('site_members').delete().eq('id',el('memberId').value);if(r.error)return msg(r.error.message);closeSheet();await loadBase();return renderSite()}
 if(e.target.closest('[data-save-profile]')){const name=el('profileName').value.trim(),r=await sb.from('profiles').upsert({id:session.user.id,email:session.user.email,full_name:name});if(r.error)return msg(r.error.message);await sb.auth.updateUser({data:{full_name:name}});await loadBase();await render();return msg('Profilo salvato')}
 if(e.target.closest('[data-logout]')){await sb.auth.signOut();session=null;profile=null;sites=[];members=[];allIssues=[];return showAuth()}
});

document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='aiInput'&&!e.shiftKey){e.preventDefault();sendAI()}});

window.addEventListener('error',e=>{console.error(e.error||e.message);if(!session&&app.textContent.includes('AVVIO'))app.innerHTML='<div class="notice">Errore di avvio. Ricarica la pagina; se continua, verifica la connessione internet.</div>'});

const gs=await sb.auth.getSession();session=gs.data.session;
if(session){await loadBase();const requested=new URLSearchParams(location.search).get('site');if(requested&&sites.some(s=>s.id===requested))siteId=requested;await render()}else showAuth();

sb.auth.onAuthStateChange(async(event,s)=>{if(s&&(!session||s.user.id!==session.user.id)){session=s;await loadBase();await render()}if(event==='SIGNED_OUT'){session=null;showAuth()}});

if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(console.warn)}
})();
</script>
</body>
</html>
