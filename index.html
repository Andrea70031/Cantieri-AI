<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071017">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<title>CantiereAI</title>
<style>
:root{
  --bg:#071017; --panel:#0d1821; --panel2:#102431; --line:#1f4c5f;
  --cyan:#37d7ff; --cyan2:#0bb5d6; --amber:#ff9d18; --text:#eef8fb;
  --muted:#8ca4ae; --red:#ff5e64; --green:#4ae0a0;
}
*{box-sizing:border-box}
body{
  margin:0;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;
  background:
    radial-gradient(circle at 80% 10%, rgba(55,215,255,.09), transparent 25%),
    radial-gradient(circle at 10% 90%, rgba(255,157,24,.06), transparent 30%),
    var(--bg);
}
body:before{
  content:"";position:fixed;inset:0;pointer-events:none;opacity:.09;
  background-image:linear-gradient(rgba(55,215,255,.16) 1px,transparent 1px),linear-gradient(90deg,rgba(55,215,255,.16) 1px,transparent 1px);
  background-size:32px 32px;
}
main{max-width:760px;margin:auto;padding:calc(env(safe-area-inset-top) + 18px) 16px 118px;min-height:100vh;position:relative;z-index:1}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.brand small{color:var(--cyan);font-size:10px;letter-spacing:3px;font-weight:900}
.brand h1{margin:4px 0 0;font-size:30px;letter-spacing:.5px}
.core{width:54px;height:54px;border:2px solid var(--amber);border-radius:50%;display:grid;place-items:center;box-shadow:0 0 24px rgba(255,157,24,.25)}
.core:after{content:"";width:28px;height:28px;border-radius:50%;background:var(--amber);box-shadow:0 0 22px rgba(255,157,24,.55)}
.hudline{height:1px;background:linear-gradient(90deg,var(--cyan),transparent);margin-bottom:18px;opacity:.7}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card,.item,.empty{background:linear-gradient(180deg,rgba(16,36,49,.92),rgba(10,24,33,.92));border:1px solid rgba(55,215,255,.22);border-radius:18px;padding:16px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.01)}
.card{position:relative;overflow:hidden}
.card:before{content:"";position:absolute;left:0;top:0;width:48px;height:2px;background:var(--cyan)}
.num{font-size:36px;font-weight:900}
.lab{font-size:11px;color:var(--muted);font-weight:900;letter-spacing:1px}
.section{margin-top:22px}
.section h3{font-size:14px;color:var(--cyan);letter-spacing:3px;margin-bottom:10px}
.item{margin:9px 0}
.job{color:var(--amber);font-size:12px;font-weight:900;letter-spacing:.5px}
.muted{color:var(--muted);font-size:14px;margin-top:4px}
.kicker{display:flex;justify-content:space-between;gap:10px;align-items:center}
.progress{height:8px;background:#071017;border-radius:999px;margin-top:10px;overflow:hidden;border:1px solid rgba(55,215,255,.12)}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan2),var(--cyan));box-shadow:0 0 12px rgba(55,215,255,.6)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;background:#09131bea;backdrop-filter:blur(16px);border-top:1px solid rgba(55,215,255,.2);padding:7px 0 calc(env(safe-area-inset-bottom) + 6px);z-index:20}
nav button{border:0;background:none;color:var(--muted);padding:9px 11px;font-size:12px;font-weight:700;letter-spacing:.15px}
nav .on{color:var(--amber)}
#plus{position:fixed;right:20px;bottom:88px;width:62px;height:62px;border-radius:50%;border:1px solid #ffbd5b;background:var(--amber);font-size:30px;font-weight:800;z-index:21;box-shadow:0 0 24px rgba(255,157,24,.35)}
#sheet{position:fixed;inset:0;background:#000b;display:none;align-items:flex-end;z-index:40}
#sheet.open{display:flex}
.sheetBox{width:100%;max-height:88vh;overflow:auto;background:#09141c;border-radius:26px 26px 0 0;border-top:1px solid var(--cyan2);padding:18px 16px calc(env(safe-area-inset-bottom) + 20px);box-shadow:0 -20px 40px #0008}
.sheetTop{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.sheetTop b{color:var(--cyan);letter-spacing:1px;font-size:18px}
.close,.mini{background:var(--panel2);color:var(--text);border:1px solid rgba(55,215,255,.2);border-radius:10px;padding:8px 11px}
input,textarea,select{width:100%;padding:14px;margin:5px 0 12px;border-radius:12px;border:1px solid rgba(55,215,255,.2);background:#061019;color:white;font-size:16px;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--cyan);box-shadow:0 0 0 2px rgba(55,215,255,.08)}
textarea{min-height:90px}
.save{width:100%;border:0;border-radius:13px;background:linear-gradient(90deg,#ff8d0a,#ffb22d);padding:15px;font-weight:900;font-size:16px;color:#111}
.ghost{width:100%;border:1px solid rgba(55,215,255,.22);border-radius:13px;background:var(--panel);color:var(--text);padding:13px;margin-top:8px;font-weight:700}
.danger{color:var(--red)}
.ok{color:var(--green)}
.rowBtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.search{margin:12px 0}
.chips{display:flex;gap:8px;overflow:auto}
.chip{white-space:nowrap;border:1px solid rgba(55,215,255,.18);background:var(--panel);color:var(--muted);border-radius:999px;padding:8px 11px;font-size:12px}
.chip.active{background:var(--cyan2);color:#001018}
.statuspill{font-size:12px;padding:4px 8px;border-radius:999px;background:#102431;border:1px solid rgba(55,215,255,.2)}
#map{height:52vh;min-height:390px;border-radius:18px;border:1px solid rgba(55,215,255,.28);overflow:hidden;box-shadow:0 0 28px rgba(55,215,255,.08)}
.mapNote{font-size:12px;color:var(--muted);margin:10px 0 14px;line-height:1.45}.mapActions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.mapBtn{border:1px solid rgba(55,215,255,.25);background:var(--panel2);color:var(--text);border-radius:10px;padding:9px 11px;font-weight:700}.leaflet-control-attribution{font-size:9px!important}
</style>
</head>
<body>
<main id="app"></main>
<button id="plus" aria-label="Aggiungi">+</button>
<nav id="bottomNav">
  <button class="on" data-page="home">⌂<br>HOME</button>
  <button data-page="sites">▣<br>CANTIERI</button>
  <button data-page="acts">✓<br>ATTIVITÀ</button>
  <button data-page="issues">⚠<br>PROBLEMI</button>
  <button data-page="radar">◎<br>RADAR</button>
</nav>
<div id="sheet">
  <div class="sheetBox">
    <div class="sheetTop">
      <b id="sheetTitle">NUOVO INSERIMENTO</b>
      <button class="close" id="closeSheet">Chiudi</button>
    </div>
    <div id="sheetBody"></div>
  </div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function(){
  let page='home';
  let issueFilter='all';
  let editingSiteId=null;

  function loadDb(){
    try{
      const parsed=JSON.parse(localStorage.getItem('cantiereAI')||'null');
      if(parsed&&parsed.sites&&parsed.acts&&parsed.issues) return parsed;
    }catch(e){}
    return {sites:[],acts:[],issues:[]};
  }
  let db=loadDb();

  const app=document.getElementById('app');
  const plus=document.getElementById('plus');
  const sheet=document.getElementById('sheet');
  const sheetTitle=document.getElementById('sheetTitle');
  const sheetBody=document.getElementById('sheetBody');
  const closeSheetBtn=document.getElementById('closeSheet');
  const bottomNav=document.getElementById('bottomNav');

  const saveDb=()=>localStorage.setItem('cantiereAI',JSON.stringify(db));
  const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  const esc=(s)=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const clamp=(n,min,max)=>Math.max(min,Math.min(max,Number(n)||0));

  function header(content){
    app.innerHTML=`<header><div class="brand"><small>JARVIS CONSTRUCTION OS</small><h1>CANTIERE AI</h1></div><div class="core"></div></header><div class="hudline"></div>${content}`;
  }

  function openSheet(title, content){
    sheetTitle.textContent=title;
    sheetBody.innerHTML=content;
    sheet.classList.add('open');
  }

  function closeSheet(){
    sheet.classList.remove('open');
    editingSiteId=null;
  }

  function setPage(newPage){
    page=newPage;
    Array.from(bottomNav.querySelectorAll('button')).forEach(btn=>btn.classList.toggle('on',btn.dataset.page===page));
    render();
  }

  function render(){
    if(page==='home') return renderHome();
    if(page==='sites') return renderSites();
    if(page==='acts') return renderActs();
    if(page==='issues') return renderIssues();
    if(page==='radar') return renderRadar();
  }

  function renderHome(){
    const openIssues=db.issues.filter(x=>!x.done).length;
    const activeSites=db.sites.filter(x=>x.status!=='Completato').length;
    header(`
      <div class="grid">
        <div class="card"><div class="num">${activeSites}</div><div class="lab">CANTIERI ATTIVI</div></div>
        <div class="card"><div class="num">${openIssues}</div><div class="lab">PROBLEMI APERTI</div></div>
      </div>
      <div class="section">
        <h3>ATTIVITÀ RECENTI</h3>
        ${db.acts.slice().sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,5).map(x=>`<div class="item"><b>${esc(x.title)}</b><div class="job">COMMESSA ${esc(x.job)}</div><div class="muted">${esc(x.notes)}</div></div>`).join('') || '<div class="empty">Sistema pronto. Premi + per iniziare.</div>'}
      </div>
      <div class="section">
        <h3>STATO CANTIERI</h3>
        ${db.sites.slice(0,4).map(x=>`<div class="item"><div class="kicker"><b>${esc(x.name)}</b><span class="job">${clamp(x.progress,0,100)}%</span></div><div class="muted">${esc(x.job)} · ${esc(x.client || '')}</div><div class="progress"><i style="width:${clamp(x.progress,0,100)}%"></i></div></div>`).join('') || '<div class="empty">Nessun cantiere.</div>'}
      </div>
    `);
  }

  function renderSites(){
    header(`
      <input class="search" id="siteSearch" placeholder="Cerca commessa, cantiere o cliente">
      <div class="section"><h3>CANTIERI</h3><div id="siteList"></div></div>
    `);
    document.getElementById('siteSearch').addEventListener('input', drawSites);
    drawSites();
  }

  function drawSites(){
    const q=(document.getElementById('siteSearch')?.value || '').toLowerCase().trim();
    const list=db.sites.filter(x=>[x.job,x.name,x.client,x.address,x.status].join(' ').toLowerCase().includes(q));
    document.getElementById('siteList').innerHTML = list.map(x=>`
      <div class="item">
        <div class="kicker"><b>${esc(x.name)}</b><span class="statuspill">${esc(x.status || 'Attivo')}</span></div>
        <div class="job">COMMESSA ${esc(x.job)}</div>
        <div class="muted">${esc(x.client || '')}${x.address ? ' · ' + esc(x.address) : ''}</div>
        <div class="progress"><i style="width:${clamp(x.progress,0,100)}%"></i></div>
        <div class="rowBtns">
          <button class="mini" data-action="edit-site" data-id="${x.id}">Modifica</button>
          <button class="mini danger" data-action="delete-site" data-id="${x.id}">Elimina</button>
        </div>
      </div>
    `).join('') || '<div class="empty">Nessun cantiere.</div>';
  }

  function renderActs(){
    header(`
      <div class="section">
        <h3>ATTIVITÀ</h3>
        ${db.acts.slice().sort((a,b)=>new Date(b.date)-new Date(a.date)).map(x=>`<div class="item"><b>${esc(x.title)}</b><div class="job">COMMESSA ${esc(x.job)}</div><div class="muted">${esc(x.notes)}</div><div class="rowBtns"><button class="mini danger" data-action="delete-act" data-id="${x.id}">Elimina</button></div></div>`).join('') || '<div class="empty">Nessuna attività.</div>'}
      </div>
    `);
  }

  function renderIssues(){
    header(`
      <div class="chips">
        <button class="chip ${issueFilter==='all'?'active':''}" data-filter="all">Tutti</button>
        <button class="chip ${issueFilter==='open'?'active':''}" data-filter="open">Aperti</button>
      </div>
      <div class="section"><h3>PROBLEMI</h3><div id="issueList"></div></div>
    `);
    document.querySelectorAll('[data-filter]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        issueFilter=btn.dataset.filter;
        renderIssues();
      });
    });
    drawIssues();
  }

  function drawIssues(){
    const arr=issueFilter==='open' ? db.issues.filter(x=>!x.done) : db.issues;
    document.getElementById('issueList').innerHTML = arr.slice().sort((a,b)=>new Date(b.date)-new Date(a.date)).map(x=>`
      <div class="item">
        <b class="${x.done ? 'ok' : 'danger'}">${x.done ? '✓' : '⚠'} ${esc(x.title)}</b>
        <div class="job">${esc(x.job)} · ${esc(x.priority)}</div>
        <div class="muted">${esc(x.details)}</div>
        <div class="rowBtns">
          <button class="mini" data-action="toggle-issue" data-id="${x.id}">${x.done ? 'Riapri' : 'Risolto'}</button>
          <button class="mini danger" data-action="delete-issue" data-id="${x.id}">Elimina</button>
        </div>
      </div>
    `).join('') || '<div class="empty">Nessun problema.</div>';
  }


  async function renderRadar(){
    header(`
      <div class="section">
        <h3>SITE RADAR</h3>
        <div class="mapNote">Vista tattica di tutti i cantieri. La mappa usa una base cartografica gratuita; ogni cantiere può essere aperto direttamente in Google Maps con un tocco.</div>
        <div id="map"></div>
        <div id="radarList"></div>
      </div>
    `);

    const mapEl=document.getElementById('map');
    if(typeof L==='undefined'){
      mapEl.innerHTML='<div class="empty">Mappa non disponibile al momento.</div>';
      return;
    }

    const map=L.map('map',{zoomControl:true}).setView([45.45,11.55],8);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
      maxZoom:19,
      attribution:'© OpenStreetMap'
    }).addTo(map);

    const markers=[];
    const located=[];

    for(const site of db.sites){
      if(!site.address) continue;
      let lat=site.lat, lon=site.lon;

      if(lat==null || lon==null){
        try{
          const q=encodeURIComponent(site.address + ', Italia');
          const res=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q='+q,{
            headers:{'Accept':'application/json'}
          });
          const arr=await res.json();
          if(arr && arr[0]){
            lat=Number(arr[0].lat); lon=Number(arr[0].lon);
            site.lat=lat; site.lon=lon; saveDb();
          }
        }catch(e){}
      }

      if(lat!=null && lon!=null){
        const marker=L.circleMarker([lat,lon],{
          radius:9,
          color:'#37d7ff',
          weight:2,
          fillColor:'#ff9d18',
          fillOpacity:.95
        }).addTo(map);
        marker.bindPopup(`<b>${esc(site.name)}</b><br>Commessa ${esc(site.job)}<br>${esc(site.address)}`);
        markers.push(marker);
        located.push(site);
      }
    }

    if(markers.length){
      const group=L.featureGroup(markers);
      map.fitBounds(group.getBounds().pad(.22));
    }

    document.getElementById('radarList').innerHTML = `
      <div class="section"><h3>CANTIERI LOCALIZZATI</h3>
      ${db.sites.map(site=>`
        <div class="item">
          <div class="kicker"><b>${esc(site.name)}</b><span class="job">${esc(site.job)}</span></div>
          <div class="muted">${esc(site.address || 'Indirizzo non inserito')}</div>
          <div class="mapActions">
            ${site.address ? `<button class="mapBtn" data-gmaps="${encodeURIComponent(site.address)}">Apri in Google Maps</button>` : ''}
          </div>
        </div>`).join('') || '<div class="empty">Inserisci almeno un cantiere per popolare il radar.</div>'}
      </div>`;

    document.querySelectorAll('[data-gmaps]').forEach(btn=>{
      btn.addEventListener('click',()=>{
        const addr=btn.dataset.gmaps;
        window.open('https://www.google.com/maps/search/?api=1&query='+addr,'_blank');
      });
    });

    setTimeout(()=>map.invalidateSize(),150);
  }

  function showAddMenu(){
    openSheet('NUOVO INSERIMENTO', `
      <button class="save" data-open-form="site">+ Nuovo cantiere</button>
      <button class="ghost" data-open-form="act">+ Nuova attività</button>
      <button class="ghost" data-open-form="issue">+ Nuovo problema</button>
    `);
  }

  function showSiteForm(site){
    editingSiteId=site ? site.id : null;
    openSheet(site ? 'MODIFICA CANTIERE' : 'NUOVO CANTIERE', `
      <input id="fJob" placeholder="Numero commessa" value="${esc(site?.job)}">
      <input id="fName" placeholder="Nome cantiere" value="${esc(site?.name)}">
      <input id="fClient" placeholder="Cliente" value="${esc(site?.client)}">
      <input id="fAddress" placeholder="Indirizzo" value="${esc(site?.address)}">
      <select id="fStatus">
        <option ${site?.status==='Attivo'?'selected':''}>Attivo</option>
        <option ${site?.status==='In pausa'?'selected':''}>In pausa</option>
        <option ${site?.status==='Completato'?'selected':''}>Completato</option>
      </select>
      <input id="fProgress" type="number" min="0" max="100" placeholder="Avanzamento %" value="${clamp(site?.progress,0,100)}">
      <button class="save" data-save="site">SALVA</button>
    `);
  }

  function showActForm(){
    openSheet('NUOVA ATTIVITÀ', `
      <input id="fTitle" placeholder="Attività">
      <input id="fJob" placeholder="Numero commessa">
      <textarea id="fNotes" placeholder="Note"></textarea>
      <button class="save" data-save="act">SALVA</button>
    `);
  }

  function showIssueForm(){
    openSheet('NUOVO PROBLEMA', `
      <input id="fTitle" placeholder="Problema">
      <input id="fJob" placeholder="Numero commessa">
      <select id="fPriority">
        <option>Media</option>
        <option>Alta</option>
        <option>Critica</option>
      </select>
      <textarea id="fDetails" placeholder="Dettagli"></textarea>
      <button class="save" data-save="issue">SALVA</button>
    `);
  }

  function saveSite(){
    const job=document.getElementById('fJob').value.trim();
    const name=document.getElementById('fName').value.trim();
    if(!job || !name){ alert('Inserisci numero commessa e nome cantiere.'); return; }
    const site={
      id: editingSiteId || uid(),
      job,
      name,
      client: document.getElementById('fClient').value.trim(),
      address: document.getElementById('fAddress').value.trim(),
      status: document.getElementById('fStatus').value,
      progress: clamp(document.getElementById('fProgress').value,0,100)
    };
    if(editingSiteId){
      const i=db.sites.findIndex(x=>x.id===editingSiteId);
      if(i>=0) db.sites[i]=site;
    }else{
      db.sites.push(site);
    }
    saveDb();
    closeSheet();
    setPage('sites');
  }

  function saveAct(){
    const title=document.getElementById('fTitle').value.trim();
    if(!title){ alert('Inserisci il titolo attività.'); return; }
    db.acts.push({
      id: uid(),
      title,
      job: document.getElementById('fJob').value.trim(),
      notes: document.getElementById('fNotes').value.trim(),
      date: new Date().toISOString()
    });
    saveDb();
    closeSheet();
    setPage('acts');
  }

  function saveIssue(){
    const title=document.getElementById('fTitle').value.trim();
    if(!title){ alert('Inserisci il problema.'); return; }
    db.issues.push({
      id: uid(),
      title,
      job: document.getElementById('fJob').value.trim(),
      priority: document.getElementById('fPriority').value,
      details: document.getElementById('fDetails').value.trim(),
      done: false,
      date: new Date().toISOString()
    });
    saveDb();
    closeSheet();
    setPage('issues');
  }

  bottomNav.addEventListener('click', (e)=>{
    const btn=e.target.closest('button[data-page]');
    if(btn) setPage(btn.dataset.page);
  });

  plus.addEventListener('click', ()=>{
    if(page==='home') showAddMenu();
    else if(page==='sites') showSiteForm(null);
    else if(page==='acts') showActForm();
    else if(page==='issues') showIssueForm();
    else if(page==='radar') showSiteForm(null);
  });

  closeSheetBtn.addEventListener('click', closeSheet);
  sheet.addEventListener('click', (e)=>{ if(e.target===sheet) closeSheet(); });

  document.addEventListener('click', (e)=>{
    const open=e.target.closest('[data-open-form]');
    if(open){
      if(open.dataset.openForm==='site') showSiteForm(null);
      if(open.dataset.openForm==='act') showActForm();
      if(open.dataset.openForm==='issue') showIssueForm();
      return;
    }

    const save=e.target.closest('[data-save]');
    if(save){
      if(save.dataset.save==='site') saveSite();
      if(save.dataset.save==='act') saveAct();
      if(save.dataset.save==='issue') saveIssue();
      return;
    }

    const actionBtn=e.target.closest('[data-action]');
    if(!actionBtn) return;
    const id=actionBtn.dataset.id;

    if(actionBtn.dataset.action==='edit-site'){
      const site=db.sites.find(x=>x.id===id);
      if(site) showSiteForm(site);
      return;
    }
    if(actionBtn.dataset.action==='delete-site'){
      if(confirm('Eliminare questo cantiere?')){
        db.sites=db.sites.filter(x=>x.id!==id);
        saveDb();
        render();
      }
      return;
    }
    if(actionBtn.dataset.action==='delete-act'){
      db.acts=db.acts.filter(x=>x.id!==id);
      saveDb();
      render();
      return;
    }
    if(actionBtn.dataset.action==='toggle-issue'){
      const issue=db.issues.find(x=>x.id===id);
      if(issue){
        issue.done=!issue.done;
        saveDb();
        renderIssues();
      }
      return;
    }
    if(actionBtn.dataset.action==='delete-issue'){
      db.issues=db.issues.filter(x=>x.id!==id);
      saveDb();
      renderIssues();
      return;
    }
  });

  if('serviceWorker' in navigator){ navigator.serviceWorker.register('./sw.js').catch(()=>{}); }
  render();
})();
</script>
</body>
</html>
